    {
      "id": 2,
      "title": "Chapter Two: Youth at USTC",
      "sections": [
        {
          "sectionId": 1,
          "heading": "The Golden Exterior, Rotting Interior",
          "paragraphs": [
            {
              "en": "In dreams, whenever I think of Hefei, I always confuse it with other cities—even with the little county town of Lintong. Sometimes, looking up at the flocks of grey pigeons <span class=\"vocab-trigger\" data-vocab=\"wheeling\">wheeling<\/span> in Toronto's sky, I think of Hefei too. The University of Science and Technology of China, or USTC, is now <span class=\"vocab-trigger\" data-vocab=\"mocked\">mocked<\/span> online as \"Ku Zi Da\"—Trousers Big. This university, once the most <span class=\"vocab-trigger\" data-vocab=\"selective\">selective<\/span> in China, has long since lost its <span class=\"vocab-trigger\" data-vocab=\"limelight\">limelight<\/span> to Peking and Tsinghua, even to Nanjing University. Only overseas, when someone shouts \"Ku Zi Da,\" do you realise how many of its <span class=\"vocab-trigger\" data-vocab=\"alumni\">alumni<\/span> have <span class=\"vocab-trigger\" data-vocab=\"scattered\">scattered<\/span> like birds to every corner of the world. Yet for personal reasons, I never admit to being a \"Ku Zi Da\" graduate myself.",
              "zh": "在梦里，只要想起合肥，我总是会把它和另一些城市混淆，甚至混淆于小小的临潼县城。有时候，我仰头看见多伦多天空中飞舞的鸽群，灰色的那些，也会让我想起合肥。合肥的中科大，如今在网上被人戏称为裤子大。这个当年中国取分最高的大学，如今的风头，远不如北大清华，甚至南大。只有在海外，呼喊一声\"裤子大\"，才发现，多少科大弟子，原来都鸟散在了世界各地。不过，出于个人原因，我从不对人承认我也是曾是\"裤子大\"弟子。",
              "simpEn": "In dreams, when I think of Hefei, I always mix it up with other cities, even the small town of Lintong. Sometimes, looking at grey pigeons flying in Toronto's sky, I also think of Hefei. USTC is now laughed at online as 'Ku Zi Da'—Big Trousers. This university, once the hardest to get into in China, has lost its fame to Peking, Tsinghua, even Nanjing University. Only overseas, when someone shouts 'Ku Zi Da,' you realise how many of its graduates have spread like birds everywhere. But for personal reasons, I never admit to being a 'Ku Zi Da' graduate myself.",
              "simpZh": "梦里一想合肥，我总会把它和别的城市搞混，甚至和临潼小县城弄混。有时仰头看多伦多天空中灰色鸽子飞翔，我也会想起合肥。中科大如今在网上被嘲笑叫\"裤子大\"。这个当年中国录取分最高的大学，如今风头远不如北大清华，甚至南大。只有在海外，有人喊一声\"裤子大\"，你才发现多少科大毕业生像鸟一样散落在世界各地。但出于个人原因，我从不承认自己是\"裤子大\"毕业生。"
            },
            {
              "en": "Truth be told, I have always believed that USTC's Special Class for Gifted Youth was a case of \"<span class=\"vocab-trigger\" data-vocab=\"golden exterior rotting interior\">golden exterior, rotting interior<\/span>.\" Though it <span class=\"vocab-trigger\" data-vocab=\"boasted\">boasted<\/span> a <span class=\"vocab-trigger\" data-vocab=\"steady stream\">steady stream<\/span> of child prodigies, to lock a group of <span class=\"vocab-trigger\" data-vocab=\"underdeveloped\">underdeveloped<\/span>—or not yet developed—boys and girls inside a university and pit them against each other in endless examinations was deeply <span class=\"vocab-trigger\" data-vocab=\"inhumane\">inhumane<\/span>. So I always tell others that not a single true prodigy ever came out of that place—only <span class=\"vocab-trigger\" data-vocab=\"fake prodigies\">fake prodigies<\/span> who knew how to take tests.",
              "zh": "其实，从我个人角度，科大少年班，我一直以为，也是一个金玉其表，败絮其中的地方。那里虽然号称神童辈出，但把一些发育不良甚至还没有发育的少年男女，关在一个大学里，进行学习和考试的比赛，是非常反人道的行为。所以，我总对别人说，那里从没有出过一个真神童，全是只会考试的假神童。",
              "simpEn": "To be honest, I have always believed that USTC's gifted class was 'golden outside, rotten inside.' Though it had many child prodigies, locking a group of underdeveloped or not yet developed boys and girls in a university and making them compete in endless exams was deeply cruel. So I always tell others that not a single true prodigy ever came out—only fake ones who knew how to take tests.",
              "simpZh": "说实话，我一直以为科大少年班是金玉其表、败絮其中。虽然号称神童辈出，但把一群发育不良甚至还没发育的少男少女关在大学里，让他们在无尽的考试中竞争，是非常不人道的。所以我总对别人说，那里从没出过真神童，全是只会考试的假神童。"
            },
            {
              "en": "China's most popular film that year was <span class=\"vocab-trigger\" data-vocab=\"Curse of the Golden Flower\">Curse of the Golden Flower<\/span>, another <span class=\"vocab-trigger\" data-vocab=\"commercial offering\">commercial offering<\/span> from my <span class=\"vocab-trigger\" data-vocab=\"fellow Shaanxi native\">fellow Shaanxi native<\/span>, Director Zhang. It used vast quantities of gold and chrysanthemums to <span class=\"vocab-trigger\" data-vocab=\"depict\">depict<\/span> that feeling. I personally think the film itself is just such a \"golden exterior, rotting interior,\" because its <span class=\"vocab-trigger\" data-vocab=\"essence\">essence<\/span> is also inhumane. Taiwan's Ang Lee won awards for his film about homosexuality; Director Zhang, in turn, went straight to <span class=\"vocab-trigger\" data-vocab=\"incest\">incest<\/span>. Yet there was one thing that <span class=\"vocab-trigger\" data-vocab=\"shook me\">shook me<\/span>: a <span class=\"vocab-trigger\" data-vocab=\"lyric\">lyric<\/span> from one of its songs: \"My whole life is written on paper.\" A life of black ink on white paper—how much truth and falsehood can we <span class=\"vocab-trigger\" data-vocab=\"distinguish\">distinguish<\/span> within it?",
              "zh": "中国，今年最流行的一个电影名叫《满城尽带黄金甲》，是陕西老乡张大师进军商业的又一巨献。里面用了大量黄金和菊花，来描述这种感觉。虽然，我认为，这电影本身其实也是这么个金玉其表、败絮其中的东西。因为这个电影的本质也是反人道。台湾李安大师拍了拍同性恋得了奖，那张大师就只好直接去拍乱伦。当然，里面也有让我震撼的东西。那不过是其中的一首歌的一句歌词，那句词是：\"我一生在纸上。\"白纸黑字的人生，那里面又有多少真真假假，能让我们分辨。",
              "simpEn": "China's most popular film that year was Curse of the Golden Flower, another commercial movie by Director Zhang, a fellow Shaanxi native. It used lots of gold and chrysanthemums to show that feeling. I personally think the film itself is also 'golden outside, rotten inside,' because its core is also cruel. Taiwan's Ang Lee won awards for his film about homosexuality; Director Zhang, instead, went straight to incest. But one thing shook me: a line from a song: 'My whole life is written on paper.' A life of black ink on white paper—how much truth and lies can we tell apart?",
              "simpZh": "那年中国最流行的电影是《满城尽带黄金甲》，陕西老乡张大师的又一部商业片。它用了大量黄金和菊花来描绘那种感觉。我个人觉得这电影本身也是金玉其外、败絮其中，因为它的本质也是反人道的。台湾李安拍同性恋得了奖，张大师就直接去拍乱伦。但有一处震撼了我：里面一首歌的一句词：\"我一生在纸上。\"白纸黑字的人生，里面有多少真假，我们能分辨出来？"
            },
            {
              "en": "I have always believed that <span class=\"vocab-trigger\" data-vocab=\"falsehood\">falsehood<\/span> fills Chinese culture and Chinese stories. Perhaps the Chinese are all <span class=\"vocab-trigger\" data-vocab=\"born novelists\">born novelists<\/span>, like me. For instance, the long <span class=\"vocab-trigger\" data-vocab=\"serialised\">serialised<\/span> story of Yue Fei that I listened to on the radio with Dai Dai and Lao Shui in Lintong—the one about the <span class=\"vocab-trigger\" data-vocab=\"loyal general\">loyal general<\/span>—has now been proven by <span class=\"vocab-trigger\" data-vocab=\"modern scholars\">modern scholars<\/span> to be largely invented by his grandson, <span class=\"vocab-trigger\" data-vocab=\"mixing truth with fiction\">mixing truth with fiction<\/span> in the History of the Song Dynasty. If <span class=\"vocab-trigger\" data-vocab=\"fictionalising\">fictionalising<\/span> history <span class=\"vocab-trigger\" data-vocab=\"qualifies\">qualifies<\/span> one for the Nobel Prize in Literature, then Yue Fei's grandson would surely have won it for China. According to research, General Yue Fei was never an <span class=\"vocab-trigger\" data-vocab=\"invincible\">invincible<\/span> warrior, but rather a <span class=\"vocab-trigger\" data-vocab=\"hot-tempered\">hot-tempered<\/span>, somewhat <span class=\"vocab-trigger\" data-vocab=\"warlord\">warlord<\/span>-like Southern Song commander. He did resist the Jin, but there were no great victories over the \"<span class=\"vocab-trigger\" data-vocab=\"Guaizi Horse\">Guaizi Horse<\/span>\" cavalry, no triumph at Zhuxian Town, no spearing of young prince Liang, and no <span class=\"vocab-trigger\" data-vocab=\"twelve gold plaques\">twelve gold plaques<\/span> summoning him back. Yue Fei's greatest victory was killing five hundred Jin soldiers. He was called \"Grandpa Yue\" because he always speared the Chinese <span class=\"vocab-trigger\" data-vocab=\"cannon fodder\">cannon fodder<\/span> the Jin had forced to the front. Even the famous poem \"<span class=\"vocab-trigger\" data-vocab=\"Man Jiang Hong\">Man Jiang Hong<\/span>,\" which I so loved, is now thought to be a Ming dynasty <span class=\"vocab-trigger\" data-vocab=\"forgery\">forgery<\/span>.",
              "zh": "我一直认为虚假充实着中国文化和中国故事。也许中国人都是天生的和我一样的小说家吧。例如，我小时候在临潼和戴戴老水一起捧着收音机追听的长篇评书《岳飞传》，今人考证，他的故事都是他的孙子在《宋史》里真实加虚构，大量发挥而就的。如果能把历史当小说来写，那岳飞之孙的手法一定可以为我们华人豪夺诺贝尔文学奖。据考证，岳飞他老人家其实根本不是无敌大将，不过是一性格暴躁点军阀作风的南宋将领。他抗金是真，但历史上根本没有大破拐子马、朱仙镇大捷，也根本没有枪挑小梁王或者十二道金牌。岳飞最大的胜利是杀金人五百。岳飞被叫做\"岳爷爷\"也是因为他总是枪挑金人的汉人炮灰，那些汉人被金人抓去堵枪眼。连我最喜欢的《满江红》也是明人的伪作。",
              "simpEn": "I have always believed that falsehood fills Chinese culture and stories. Perhaps the Chinese are all born novelists, like me. For example, the long radio story of Yue Fei that I listened to with Dai Dai and Lao Shui in Lintong—the loyal general—has now been proven by modern scholars to be mostly invented by his grandson, mixing truth and fiction in the History of the Song Dynasty. If making up history qualifies one for the Nobel Prize, then Yue Fei's grandson would surely have won for China. According to research, General Yue Fei was never an unbeatable warrior, but rather a hot-tempered, warlord-like Southern Song commander. He did resist the Jin, but there were no great victories. Yue Fei's greatest victory was killing five hundred Jin soldiers. He was called 'Grandpa Yue' because he always speared the Chinese cannon fodder the Jin had forced to the front. Even the famous poem 'Man Jiang Hong,' which I loved, is now thought to be a Ming dynasty fake.",
              "simpZh": "我一直以为虚假充满了中国文化和故事。也许中国人都是天生的和我一样的小说家。例如我小时候在临潼和戴戴老水一起追听的长篇评书《岳飞传》，现代学者证明主要是他孙子在《宋史》里真真假假编出来的。如果把历史写成小说就能得诺贝尔奖，那岳飞的孙子肯定替我们华人拿了。据考证，岳飞根本不是无敌大将，只是个脾气暴躁、有点军阀作风的南宋将领。他抗金是真的，但根本没有大胜仗。岳飞最大的胜利是杀了五百金兵。他被称为\"岳爷爷\"是因为他总枪挑金人抓去当炮灰的汉人。连我最喜欢的《满江红》现在也被认为是明代的伪作。"

              "simpEn": "I have always felt that the legendary USTC gifted class was also such a mix of gold and rot. Though it produced people I later admired—Academician Yang Yang, the 'Great Qianmen' president in Beijing—people only see the successes and think China's geniuses are the world's best. If they are geniuses at all, perhaps they are just Chinese exam geniuses. Indeed, many of my gifted classmates became overseas scientific elites or domestic leaders. A quick look at the class directory shows a long list of PhD supervisors and employees of top IT companies. But it also includes a monk, an unemployed master's degree holder, nameless dropouts, and a former Shaanxi prodigy now living in Toronto, scraping by on writing fragments of broken memories—me, Huang Xiang.",
              "simpZh": "我一直以为传说中的科大少年班也是这种金玉和败絮。虽然里面出了我后来敬佩的杨杨院士、北京\"大前门\"总裁。人们总看见成功者，觉得中国的天才是全世界最优秀的。如果他们是天才，也许只是中国特色的考试天才。确实，我的很多少年班同学成了海外科技精英或国内栋梁。翻翻同学录，博导、世界IT百强公司员工一串串。但其中也有出家的和尚、失业的硕士、无名的退学者，以及现在住在多伦多靠写点破碎记忆过活的陕西前神童——我，黄翔。"

          "sectionId": 2,
          "heading": "The Mountain Higher than the Mountain",
          "paragraphs": [
            {
              "en": "Yet it was precisely this gathering of the nation's child prodigies that first showed me the true meaning of \"<span class=\"vocab-trigger\" data-vocab=\"a mountain higher than the mountain\">there is always a mountain higher than the mountain<\/span>.\" I remember shortly after <span class=\"vocab-trigger\" data-vocab=\"enrolment\">enrolment<\/span>, the teacher asked us to share our dreams. All of us, small and underdeveloped as we were, spoke of aiming for the Nobel Prize in Physics, Medicine, or the <span class=\"vocab-trigger\" data-vocab=\"Fields Medal\">Fields Medal<\/span> in Mathematics. Several <span class=\"vocab-trigger\" data-vocab=\"sniffling\">sniffling<\/span> young lads declared they would solve the Goldbach <span class=\"vocab-trigger\" data-vocab=\"Conjecture\">Conjecture<\/span>.",
              "zh": "不过，正是这所谓的云集全国神童的故乡科大少年班，当年还是让我知道人类的智慧真的是人外有人、天外有天。记得开学不久，老师召集大家谈理想。大伙们个个小小的年纪，发育不良的样子，说起理想，却都是剑指诺贝尔物理学奖、医学奖或者数学的菲尔兹奖。准备破解哥特巴赫猜想的就有好几位还流鼻涕的少年弟兄。",
              "simpEn": "Yet it was exactly this gathering of the nation's child prodigies that first showed me the meaning of 'there is always a higher mountain.' I remember soon after school started, the teacher asked us to share our dreams. All of us, small and underdeveloped, spoke of aiming for the Nobel Prize or the Fields Medal. Several sniffly young lads said they would solve the Goldbach Conjecture.",
              "simpZh": "然而正是这云集全国神童的科大少年班，让我第一次知道了\"山外有山\"。记得开学不久，老师让大家谈理想。我们一个个又小又发育不良，说起理想都是剑指诺贝尔奖或菲尔兹奖。好几个流鼻涕的少年弟兄说要破解哥德巴赫猜想。"
            },
            {
              "en": "When my turn came, I said lazily: \"Since you've already <span class=\"vocab-trigger\" data-vocab=\"divvied up\">divvied up<\/span> all the world's top science prizes, I suppose I'll bring back the Nobel Prize in Literature for fun.\" Strangely, no one laughed.",
              "zh": "问到我，我则懒洋洋地说，既然这些世界顶级的科学奖都被同学们分完了，那我就去把诺贝尔文学奖弄回来玩玩吧。奇怪的是，大家居然都没笑。",
              "simpEn": "When my turn came, I said lazily: 'Since you've already shared all the world's top science prizes, I guess I'll bring back the Nobel Prize in Literature for fun.' Strangely, no one laughed.",
              "simpZh": "问到我的时候，我懒洋洋地说：既然这些顶级科学奖都被同学们分完了，那我就去把诺贝尔文学奖弄回来玩玩吧。奇怪的是大家居然都没笑。"
            },
            {
              "en": "They took everything too seriously. The competitive atmosphere, <span class=\"vocab-trigger\" data-vocab=\"tainted\">tainted<\/span> by childishness, was very odd. The reason was that everyone took grades too seriously. They believed that life was nothing but test scores. Envy and suspicion became the other main <span class=\"vocab-trigger\" data-vocab=\"themes\">themes<\/span> of our student lives.",
              "zh": "他们太当真。这里的竞争气氛因为沾染了孩子气显得非常古怪。原因就是大家把成绩都太当真。他们认为人生就是那些考试分数，嫉妒和猜疑终于成为了我们学习生活中的另一个主旋律。",
              "simpEn": "They took everything too seriously. The competitive atmosphere, spoiled by childishness, was very odd. The reason was that everyone took grades too seriously. They believed that life was nothing but test scores. Envy and suspicion became the other main themes of our student lives.",
              "simpZh": "他们太当真。竞争气氛因为沾染了孩子气显得很奇怪。原因就是大家都把成绩太当真。他们认为人生就是考试分数，嫉妒和猜疑成了我们学习生活的另一个主旋律。"
            },
            {
              "en": "I had always thought my memory was excellent. Then I discovered that among my gifted classmates, good memory wasn't my kind of cleverness—it was the kind that could <span class=\"vocab-trigger\" data-vocab=\"memorise\">memorise<\/span> an article after a single reading. The even better ones could memorise the entire Oxford Advanced Learner's English‑Chinese Dictionary.",
              "zh": "以前我总以为我的记忆力很好，结果发现神童同学们里，记忆好不是指我这类的小聪明，而是指看一篇文章一次就能会背的。记忆更好一点的是可以背全部《牛津双解英汉词典》。",
              "simpEn": "I had always thought my memory was excellent. Then I discovered that among my gifted classmates, good memory wasn't my kind of cleverness—it was the kind that could memorize an article after one reading. The even better ones could memorize the entire Oxford Advanced Learner's English-Chinese Dictionary.",
              "simpZh": "我以前总以为自己记忆力很好，结果发现神童同学们的记忆好不是我这种小聪明，而是看一篇文章一次就能背下来。更厉害的是能背整本《牛津双解英汉词典》。"
            },
            {
              "en": "The one <span class=\"vocab-trigger\" data-vocab=\"universally\">universally<\/span> acknowledged as having the best memory was a fourteen‑year‑old girl from Wuhan named Yang Yang. She could recite all the classical Chinese texts from our middle school textbooks backwards—starting from the last character. Whenever she displayed this skill, I felt she was chanting another, more elegant Book of Songs. She also planned to memorise the entire Dream of the Red Chamber. It was around this time that my confidence in my own intelligence began to <span class=\"vocab-trigger\" data-vocab=\"crumble completely\">crumble completely<\/span>. I felt my memory was poor and confused. The <span class=\"vocab-trigger\" data-vocab=\"essence\">essence<\/span> of any life, I realised, is the most confused dreams.",
              "zh": "而公认记忆最好的是一个来自武汉的只有十四岁的女同学杨杨，她入学后依然能对中学语文课本里的所有古文都可以倒背如流。真正的从最后一个字开始背诵。每当她炫耀这一绝技，我总以为是她在背另一种优雅的《诗经》。她还准备把全本《红楼梦》背下来。也就是这个阶段，我有关自己智慧的信心开始彻底崩溃。我觉得自己的记忆力很差，还混乱。任何生活其实精华部分都是那些最混乱的梦境。",
              "simpEn": "The one everyone agreed had the best memory was a fourteen-year-old girl from Wuhan named Yang Yang. She could recite all the classical Chinese texts from our middle school textbooks backwards—starting from the last character. Whenever she showed off this skill, I felt she was chanting another, more elegant Book of Songs. She also planned to memorize the entire Dream of the Red Chamber. It was around this time that my confidence in my own intelligence began to completely collapse. I felt my memory was poor and confused. The essence of any life, I realised, is the most confused dreams.",
              "simpZh": "公认记忆最好的是一个来自武汉的十四岁女同学杨杨。她能倒背中学语文课本里的所有古文——从最后一个字开始背。每次她炫耀这个绝技，我都觉得她在背诵另一种更优雅的《诗经》。她还准备背下整本《红楼梦》。就在这个阶段，我对自己智力的信心开始彻底崩溃。我觉得自己的记忆力很差、很混乱。任何生活的精华，我明白了，都是最混乱的梦境。"

        {

          "paragraphs": [
            {
              "en": "Today I have almost no contact with my gifted classmates. I was the odd one out in that class. Later, labelled a failure, I transferred in <span class=\"vocab-trigger\" data-vocab=\"disgrace\">disgrace<\/span> to the Chinese Literature department of Nanjing University. I have only two friends from the gifted class whom I still keep in touch with. One is Mao Jin, now a mathematics professor at the University of Toronto—we <span class=\"vocab-trigger\" data-vocab=\"reunited\">reunited<\/span> in a foreign land and renewed our friendship. The other is Yang Yang, the girl who could recite classical texts backwards. She is now a doctoral supervisor at the Chinese Academy of Sciences and recently became China's youngest female academician. She still looks as if she is <span class=\"vocab-trigger\" data-vocab=\"perpetually\">perpetually<\/span> fourteen. A few years ago I went to Beijing to see her. She stood short and alone among her tall male graduate students and postdocs, smiling at me as Hefei smiled in the 1980s. I could not help but step forward and <span class=\"vocab-trigger\" data-vocab=\"embrace\">embrace<\/span> her, unwilling to let go.",

              "simpEn": "Today I have almost no contact with my gifted classmates. I was the odd one out. Later, called a failure, I transferred in shame to Nanjing University's Chinese department. I only have two friends from the gifted class I still keep in touch with. One is Mao Jin, now a math professor at the University of Toronto—we met again in a foreign land and renewed our friendship. The other is Yang Yang, the girl who could recite classical texts backwards. She is now a doctoral supervisor at the Chinese Academy of Sciences and recently became China's youngest female academician. She still looks forever fourteen. A few years ago I went to Beijing to see her. She stood short and alone among her tall male students, smiling at me as Hefei smiled in the 1980s. I couldn't help but step forward and hug her, unwilling to let go.",
              "simpZh": "如今我几乎和少年班同学都没来往了。我是班里的另类。后来被叫做失败者，狼狈地转学去了南京大学中文系。我只有两个还保持联系的同学。一个是毛金，现在多伦多大学当数学教授——我们在异国重逢、重续友谊。另一个是能倒背古文的杨杨。她现在在中科院当博导，不久前成了中国最年轻的女院士。她看起来永远十四岁。几年前我去北京看她，她矮矮地、孤零零地站在高大的男硕士博士生中间，对着我微笑，像八十年代的合肥一样。我忍不住上前抱住她，不肯放手。"

            {
              "en": "Our advisor told us, <span class=\"vocab-trigger\" data-vocab=\"regretfully\">regretfully<\/span>, that Teacher Ning had perhaps matured too early—entering puberty at eleven. After arriving at USTC, he stopped studying diligently and devoted himself to Go, traditional Chinese medicine, poetry, astronomy, and love. His grades were very ordinary, showing no prodigy brilliance. Teacher Ning himself had wanted to transfer to Nanjing University's astronomy department, but the university refused, citing the risk of losing a \"<span class=\"vocab-trigger\" data-vocab=\"treasure of the school\">treasure of the school<\/span>.\" Later, Teacher Ning could not even pass the graduate entrance exam—or rather, by his own account, he refused to take it; when the teacher tried to drag him to the exam hall, he ran away.",
              "zh": "据辅导员教育我们的时候说，遗憾的是，当年的宁老师，可能因为过于早熟，11岁就进入了青春期。来科大以后，他不再刻苦学习，而是潜心研究起了围棋、中医、诗歌、天文和爱情。他的学习成绩非常一般，毫无神童光彩。宁老师自己也一心想转到南京大学读天文。报批几次被校方以校宝不能流失为理由拒绝。后来宁老师连研究生也考不上。当然，拿他自己的话就是，他是不想考，老师拉他去考的时候，他跑了。",
              "simpEn": "Our advisor told us, regretfully, that Teacher Ning had perhaps matured too early—entering puberty at eleven. After arriving at USTC, he stopped studying hard and devoted himself to Go, Chinese medicine, poetry, astronomy, and love. His grades were very ordinary, showing no prodigy brilliance. Teacher Ning himself had wanted to transfer to Nanjing University's astronomy department, but the university refused, saying he was a 'treasure of the school.' Later, Teacher Ning couldn't even pass the graduate entrance exam—or rather, by his own account, he refused to take it; when the teacher tried to drag him to the exam hall, he ran away.",
              "simpZh": "辅导员教育我们时说，遗憾的是宁老师可能过于早熟，11岁就进入青春期。来科大后他不再刻苦学习，而是潜心研究围棋、中医、诗歌、天文和爱情。学习成绩非常一般，毫无神童光彩。宁老师自己一心想转到南大读天文，几次报批都被校方以\"校宝不能流失\"为由拒绝。后来他连研究生也考不上——用他自己的话说，他不想考，老师拉他去考时他跑了。"
            },
            {
              "en": "Our advisor said I resembled Teacher Ning in many ways, and offered to introduce us so I could learn from his mistakes. Teacher Ning was already the <span class=\"vocab-trigger\" data-vocab=\"cautionary tale\">cautionary tale<\/span> of the gifted class. Perhaps that was why the university insisted on keeping him at USTC. Even after his first attempt to become a monk, they sent teachers to drag him back.",
              "zh": "辅导员说我在很多方面和宁老师很像，所以想介绍我们认识，让我从他身上吸取教训。宁老师在那时候，已经是少年班的反面教材。也许，正是这个原因，才让学校坚决要把他留在了科大。就是他日后的第一次出家，也派老师去把他抓将回来。",
              "simpEn": "Our advisor said I resembled Teacher Ning in many ways, and offered to introduce us so I could learn from his mistakes. Teacher Ning was already the warning example of the gifted class. Perhaps that was why the university insisted on keeping him at USTC. Even after his first attempt to become a monk, they sent teachers to drag him back.",
              "simpZh": "辅导员说我很多方面和宁老师很像，想介绍我们认识，让我吸取教训。宁老师那时已是少年班的反面教材。也许正因如此，学校坚决要把他留在科大。就是后来他第一次出家，也派老师去把他抓回来。"
            },
            {
              "en": "I remember meeting him in the faculty office. He looked much more ordinary than legend suggested—even a little dull. My first thought was: I must never become like him. We were silent for a long time. Finally I said: \"Teacher Ning, you are my famous idol.\" He did not smile. He rubbed his hands. At last I shook his hand and said: \"I want to play Go with you.\" Only then did Teacher Ning smile. \"All right,\" he said. \"But I'm very busy lately.\"",
              "zh": "记得我是在教师办公室里见的他。他的样子比传说中朴素很多，甚至感觉表情有点呆滞。看见他的第一眼，我的心里就在说，我将来，可别变成他那样子。我们俩相对无语很久。我说，宁老师，你是我的著名偶像。他没笑，搓了搓手。最后我握了握他的手，说：\"我想和你下围棋。\"这时候宁老师才笑了，说：\"好吧。不过，我最近很忙。\"",
              "simpEn": "I remember meeting him in the faculty office. He looked much more ordinary than legend suggested—even a little dull. My first thought was: I must never become like him. We were silent for a long time. Finally I said: 'Teacher Ning, you are my famous idol.' He did not smile. He rubbed his hands. At last I shook his hand and said: 'I want to play Go with you.' Only then did Teacher Ning smile. 'All right,' he said. 'But I'm very busy lately.'",
              "simpZh": "我记得是在教师办公室里见他的。他比传说中朴素很多，甚至有点呆滞。看见他的第一眼我心里就想：我将来可别变成他那样。我们相对无语了很久。我说：宁老师，你是我的著名偶像。他没笑，搓了搓手。最后我握了握他的手说：\"我想和你下围棋。\"这时宁老师才笑了：\"好吧，不过我最近很忙。\""
            },
            {
              "en": "I smiled too. \"I look forward to learning from you.\" But in my heart, I knew the opportunity would not come often. And I knew that the day of my departure from USTC was not far off.",
              "zh": "我也笑了，说会有机会领教。其实，我自己也知道，那机会已经不会很多了。我自己知道，我离开科大的日子已经很不遥远了。",
              "simpEn": "I smiled too. 'I look forward to learning from you.' But in my heart, I knew the opportunity would not come often. And I knew that the day of my departure from USTC was not far off.",
              "simpZh": "我也笑了，说会有机会领教。其实我自己也知道，那机会已不会很多了。我离开科大的日子已经不远了。"
            }
          ],

        {
          "sectionId": 12,
          "heading": "The Transfer Application",
          "paragraphs": [
            {
              "en": "That holiday, I returned to school earlier than Dai Dai and the others. I had to take make‑up exams. USTC sent the make‑up notices to our parents. I passed two of the three, but failed one, which I would have to retake. I had also failed a make‑up exam the previous semester. Such results embarrassed not only my parents, but me. The former prodigy had become a professional failure. Teacher Zhao wanted me to go back to Railway No.1 Middle School to encourage the college‑bound students. How could I show my face sitting alongside the top scorer Wu Rou?",
              "zh": "那年假期，我比戴戴他们返校得早。因为我要去参加补考。科大的补考通知都是寄到家长那里。结果三门补考，我仍有一门没过，需要重修。上一学期也有一门补考没过。这样的成绩，不仅我父母，连我自己都开始难堪。昔日神童，现在成了不及格专业户。中学赵老师还让我回铁一中去给高考班鼓劲，我怎么还有脸面去和状元吴柔等人并排坐在一起。",
              "simpEn": "That holiday, I returned to school earlier than Dai Dai and the others. I had to take make-up exams. USTC sent the make-up notices to our parents. I passed two of the three, but failed one, which I would have to retake. I had also failed a make-up exam the previous semester. Such results embarrassed not only my parents, but me. The former prodigy had become a professional failure. Teacher Zhao wanted me to go back to Railway No.1 Middle School to encourage the college-bound students. How could I show my face sitting alongside the top scorer Wu Rou?",
              "simpZh": "那年假期我比戴戴他们返校得早。我要去参加补考。科大的补考通知都寄给家长。三门补考我仍有一门没过，需要重修。上一学期也有一门补考没过。这样的成绩不仅我父母难堪，我自己也难堪。昔日神童现在成了不及格专业户。中学赵老师还让我回铁一中给高考班鼓劲，我怎么有脸和状元吴柔等人坐在一起？"
            },
            {
              "en": "The advisor called me in for another serious talk. She also wrote to my parents. She said that the options before me were <span class=\"vocab-trigger\" data-vocab=\"stark\">stark<\/span>: repeat the year, or drop out. At the critical moment, my mother came to USTC. They asked me why I had turned from prodigy to rubbish. But I was not the first. I thought of Teacher Ning and the two neurasthenic classmates who had dropped out. They knew the answer full well: not everyone could adapt to this <span class=\"vocab-trigger\" data-vocab=\"dehumanising\">dehumanising<\/span>, forced growth.",
              "zh": "辅导员老师又一次找我严肃谈话交心，她还给我父母写信。她说，当前留给我的路，要不留级，不留级的话就只能退学，非常的严峻。最关键的时候，我妈妈都来了科大。他们问我为什么一下子由神童变成了垃圾生。其实，由神童变垃圾生，我也不是第一例了。我想起宁老师和同班那两个病退的同学。他们这样是明知故问，因为不是谁都能适应这种忽视人性成长的拔苗助长。",
              "simpEn": "The advisor called me in for another serious talk. She also wrote to my parents. She said that the options before me were harsh: repeat the year, or drop out. At the critical moment, my mother came to USTC. They asked me why I had turned from prodigy to rubbish. But I was not the first. I thought of Teacher Ning and the two classmates who had dropped out. They knew the answer full well: not everyone could adapt to this dehumanising, forced growth.",
              "simpZh": "辅导员又一次找我严肃谈话，还给我父母写信。她说眼前的出路很严峻：要么留级，要么退学。关键时候我妈妈来了科大。他们问我为什么从神童变成了垃圾生。其实我不是第一例。我想起宁老师和那两个病退的同学。他们明知故问——不是谁都能适应这种忽视人性成长的拔苗助长。"
            },
            {
              "en": "The USTC teachers said I was not stupid, but my interests were too many and too scattered, my <span class=\"vocab-trigger\" data-vocab=\"adolescent rebelliousness\">adolescent rebelliousness<\/span> too severe. If I could straighten out my thinking, I could still become a fine seedling. My mother thought the problem was that I was too far from home. If I had studied in Xi'an, I would not have failed so badly. I blamed myself for not choosing Fudan's wildlife program. Though I still had a few good friends at USTC, I felt that such fierce competition was worse than befriending wild animals.",
              "zh": "科大老师对我的评价是，人不傻，但爱好太多太杂，青春期叛逆思想严重。如果能端正思想，还会是一棵好苗子。我妈妈则认为是我离家太远，如果就近在西安读书就不会这么失败。我则埋怨，我更应该去读复旦的野生动物，虽然我还有几个科大好友，但我总的结论是这样地激烈竞争，还不如去和野生动物交朋友。",
              "simpEn": "The USTC teachers said I was not stupid, but my interests were too many and too scattered, my teenage rebellion too severe. If I could straighten out my thinking, I could still become a fine seedling. My mother thought the problem was that I was too far from home. If I had studied in Xi'an, I would not have failed so badly. I blamed myself for not choosing Fudan's wildlife program. Though I still had a few good friends at USTC, I felt that such fierce competition was worse than befriending wild animals.",
              "simpZh": "科大老师评价我：人不傻，但爱好太多太杂，青春期叛逆严重。如果能端正思想，还会是好苗子。妈妈认为是我离家太远，如果在西安读书就不会这么失败。我则埋怨更应该去复旦读野生动物——虽然我还有几个科大好友，但总体感觉这种激烈竞争还不如和野生动物交朋友。"
            },
            {
              "en": "Thinking of Teacher Ning's story, I formally proposed to transfer to another university. I knew that my mother had a middle school classmate who was chair of the Chinese Literature department at Nanjing University. I asked to transfer there. I was thoroughly sick of USTC's <span class=\"vocab-trigger\" data-vocab=\"soulless\">soulless<\/span> mathematics and sciences. The humanities, I felt, and another university, might suit me better.",
              "zh": "因为我想到宁老师的故事，我就想正式向老师提出要转学校。我知道妈妈的一个中学同学在南京大学当中文系系主任，我就提出到转到南京大学去。我彻底厌倦了学习枯燥毫无人性的数理化和科大。我觉得人文科学和别的大学可能更适合我。",
              "simpEn": "Thinking of Teacher Ning's story, I formally proposed to transfer to another university. I knew that my mother had a middle school classmate who was chair of the Chinese Literature department at Nanjing University. I asked to transfer there. I was thoroughly sick of USTC's spiritless maths and sciences. The humanities, I felt, and another university, might suit me better.",
              "simpZh": "想到宁老师的故事，我正式提出转学。我知道妈妈有个中学同学是南京大学中文系系主任，我要求转到南大去。我彻底厌倦了科大枯燥无人性的数理化。我觉得人文科学和别的大学可能更适合我。"
            },
            {
              "en": "At that time, USTC had no <span class=\"vocab-trigger\" data-vocab=\"precedent\">precedent<\/span> for a successful transfer. Teacher Ning had tried, but had been refused. The teachers initially thought my application had no chance. After all, the gifted class allowed students to choose any department within the university.",
              "zh": "当时，科大还全没有过转校成功的例子。虽然宁老师在他读书的时候闹过，但还是被无情地拒绝了。老师一开始也觉得我的申请没有任何操作性可言。少年班也是可以在全校择系的。",
              "simpEn": "At that time, USTC had no previous example of a successful transfer. Teacher Ning had tried, but had been refused. The teachers initially thought my application had no chance. After all, the gifted class allowed students to choose any department within the university.",
              "simpZh": "当时科大还没有转校成功的先例。宁老师当年闹过，但被无情拒绝。老师一开始也觉得我的申请没有任何操作性。少年班其实可以在全校选系。"
            },
            {
              "en": "My mother immediately contacted her old classmate at Nanjing University's Chinese department and sent him some of my poems. She also approached the president of USTC. From Nanjing came good news: after reading my <span class=\"vocab-trigger\" data-vocab=\"avant-garde poetry\">avant‑garde poetry<\/span>, the department chair noted the lack of rhyme and excessive <span class=\"vocab-trigger\" data-vocab=\"obscurity\">obscurity<\/span>, but still felt I had potential for literary study. He called my mother to say that the literature department was not for training writers, but for cultivating specialised literary talent. He worried that my goal was to become a writer. He agreed to speak to the president of Nanjing University. I knew he was doing this for my mother's sake, not for my unrhymed avant‑garde verse.",
              "zh": "我妈妈马上联系了南大中文系的她的中学同学，还把我写的诗歌寄了过去。同时又去找了科大的校长。首先，南大方面传来好消息，中文系主任看过我的前卫诗歌后，指出了太朦胧不押韵的缺点后，还是觉得我有学习中文的潜力的。他在电话里告诉我妈妈，中文系不是为了培养作家，而是培养中文专用人才。他怕我去学中文系是为了想当作家。他还答应去找南大校长通融。我知道，他肯这样，是看在我妈妈的老面上，而不是看在我所谓那不押韵的先锋诗歌上面。",
              "simpEn": "My mother immediately contacted her old classmate at Nanjing University's Chinese department and sent him some of my poems. She also approached the president of USTC. From Nanjing came good news: after reading my avant-garde poetry, the department chair noted the lack of rhyme and too much obscurity, but still felt I had potential for literary study. He called my mother to say that the literature department was not for training writers, but for cultivating specialised literary talent. He worried that my goal was to become a writer. He agreed to speak to the president of Nanjing University. I knew he was doing this for my mother's sake, not for my unrhymed avant-garde verse.",
              "simpZh": "妈妈马上联系了南大中文系的中学同学，把我写的诗歌寄过去。同时去找了科大校长。南大方面传来好消息：系主任看过我的前卫诗歌后，指出了太朦胧不押韵的缺点，但还是觉得我有学习中文的潜力。他打电话告诉妈妈，中文系不是培养作家的，而是培养中文专业人才。他怕我去学中文是为了当作家。他答应去找南大校长通融。我知道他肯这样是看妈妈的老面子，不是看我不押韵的先锋诗歌。"
            },
            {
              "en": "With Nanjing's <span class=\"vocab-trigger\" data-vocab=\"tentative\">tentative<\/span> acceptance, my transfer application was officially submitted to the USTC president's office. The office asked my mother to return home first. The president had gone to Beijing for a meeting, then would travel abroad. This <span class=\"vocab-trigger\" data-vocab=\"unprecedented\">unprecedented<\/span> matter, they said, required the president's study. I felt that their caution was meant to avoid upsetting Teacher Ning, whose transfer attempt had failed. They feared that if I succeeded too easily, he would be unhappy.",
              "zh": "有了南大那边的可能，我的转学报告正式交到了学校的校长办公室。校长办公室回话叫我妈妈先回去。因为校长已去北京开会，然后会去国外考察。这个从没开过先河的问题，说还要等校长研究研究。我自己感觉，他们的慎重态度其实是做给转校失败的宁老师看的。他们怕我轻易转校成功，让宁老师会不舒服。",
              "simpEn": "With Nanjing's tentative acceptance, my transfer application was officially submitted to the USTC president's office. The office asked my mother to return home first. The president had gone to Beijing for a meeting, then would travel abroad. This never-before-seen matter, they said, required the president's study. I felt that their caution was meant to avoid upsetting Teacher Ning, whose transfer attempt had failed. They feared that if I succeeded too easily, he would be unhappy.",
              "simpZh": "有了南大的可能，我的转学报告正式交到了校长办公室。校长办公室回话让我妈妈先回去。校长去了北京开会，然后出国考察。这个从没开过先河的问题要等校长研究。我感觉他们的慎重态度是做给转校失败的宁老师看的。他们怕我轻易成功让宁老师不舒服。"
            },
            {
              "en": "That semester, I basically stopped attending class. I stayed in the dormitory sleeping. When awake, I scribbled so‑called poetry—nonsense, really—and during Yang Yang's free moments, I sought her out to practice Go.",
              "zh": "那一学期，我已经基本不去上课了。成天在宿舍里睡觉。睡醒了就写一点胡言乱语的所谓诗歌。等杨杨的学习间隙就去找她练棋。",
              "simpEn": "That semester, I basically stopped attending class. I stayed in the dorm sleeping. When awake, I scribbled so-called poetry—nonsense, really—and during Yang Yang's free moments, I sought her out to practice Go.",
              "simpZh": "那一学期我基本不去上课了，成天在宿舍睡觉。睡醒了就写点胡言乱语的所谓诗歌。趁杨杨学习间隙去找她练棋。"
            },
            {
              "en": "At first, Teacher Ning <span class=\"vocab-trigger\" data-vocab=\"deigned\">deigned<\/span> not to play the three‑game match with me. I had too little reputation in USTC's Go circles. I had never officially defeated any of the university team's strong players. My only rival was my private teacher, Yang Yang. Teacher Ning was a mainstay of the faculty team, roughly amateur 4‑dan. He much preferred to play with the strong player Yang Yang. In Go, everyone wants to test themselves against a stronger opponent. You can even play professionals if you pay.",
              "zh": "起初，宁老师是不怎么屑于和我下三番棋。我在科大的围棋界名气太小。我还没有正式赢过任何一个校队高手。我的对手只是私人老师杨杨。宁老师是教工队的主力，大概是业余四段左右的棋力。他更想和高手杨杨过手。下围棋谁都想和高手过招。出钱就还可以和专业棋手下棋。",
              "simpEn": "At first, Teacher Ning did not stoop to play the three-game match with me. I had too little reputation in USTC's Go circles. I had never officially defeated any of the university team's strong players. My only rival was my private teacher, Yang Yang. Teacher Ning was a mainstay of the faculty team, roughly amateur 4-dan. He much preferred to play with the strong player Yang Yang. In Go, everyone wants to test themselves against a stronger opponent. You can even play professionals if you pay.",
              "simpZh": "起初宁老师不屑于和我下三番棋。我在科大围棋界名气太小，从未正式赢过校队高手。我的对手只是私人老师杨杨。宁老师是教工队主力，大约业余四段。他更想和高手杨杨过手。下围棋谁都想和高手过招，出钱还能和专业棋手下。"
            },
            {
              "en": "Teacher Ning was afraid of losing to Yang Yang even with a handicap. Yang Yang had to give at least two stones to every member of the university team. So he kept avoiding me. During that time, he claimed to be studying the I Ching and had lost interest in Go temporarily.",
              "zh": "宁老师很怕在让子的情况下输给杨杨。当时，杨杨和所有的校队成员下棋都要最少让两子。所以，在下棋方面，他一直在躲我。那段时间，他自称在研究易经，暂时对围棋没有了兴趣。",
              "simpEn": "Teacher Ning was afraid of losing to Yang Yang even with a handicap. Yang Yang had to give at least two stones to every member of the university team. So he kept avoiding me. During that time, he claimed to be studying the I Ching and had lost interest in Go temporarily.",
              "simpZh": "宁老师很怕让子输给杨杨。当时杨杨和所有校队成员下棋都至少让两子。所以在下棋方面他一直在躲我。那段时间他自称在研究易经，暂时对围棋没了兴趣。"

              "en": "Sometimes I deliberately confuse the <span class=\"vocab-trigger\" data-vocab=\"dreamscapes\">dreamscapes<\/span> of my university years. One moment I am at USTC, the next at Nanjing University. Sometimes my old middle school, Railway No.1, slips in as well. In truth, I preferred Nanjing University. There, the foreign languages and Chinese literature departments were always <span class=\"vocab-trigger\" data-vocab=\"teeming\">teeming<\/span> with beautiful women. Unlike USTC, which had no <span class=\"vocab-trigger\" data-vocab=\"humanities\">humanities<\/span> faculties at the time and a <span class=\"vocab-trigger\" data-vocab=\"pitifully\">pitifully<\/span> low proportion of female students—and even the pretty ones were ruined by the <span class=\"vocab-trigger\" data-vocab=\"oppressive\">oppressive<\/span> atmosphere. If USTC had held a beauty contest, Yang Yang and Wu Rou could have strutted into the top three just by walking the <span class=\"vocab-trigger\" data-vocab=\"catwalk\">catwalk<\/span>. So in my dreams, the brighter, lake‑lit scenes are usually Nanjing University; the grey, dim ones are USTC. It was there, at USTC, that I completed my physical development.",

              "simpZh": "我有时会特意搞混大学时代的梦境。一会儿是科大，一会儿是南大，有时还混进中学。本质上我更喜欢南大，因为那里外文系和中文系总是美女如云。不像科大，那时没有文科，女生比例很低，就是漂亮的也被压抑得不好了。估计科大搞选美，杨杨和吴柔走走猫步都能进前三。所以在梦里，明亮有湖水的地方往往是南大，灰暗的是科大。在那里，我彻底结束了生理发育。"

              "zh": "以后的四年，我就生活在了南大南园的十一舍。朝南还有一栋十二舍，再外面就是南京市中心的大马路了。那时候，南大刚刚开始有转系这样的改革，结果我的舍友里有转自天文系三年级的胡杰，和转自数学系三年级的张桃花。张桃花原名叫张涛华，但大家都叫他张桃花，他也不反感这个称呼。想当然就可以知道，为什么这么叫他，都说他特别有女人缘，走桃花运。",

              "en": "When I first arrived at Nanjing University, I dared not call myself a poet. The poetry heavyweight in the Chinese department was Da Hai, a specially admitted student. It was said that he had arrived from Suzhou, tossed a hundred of his published poems onto the department chair's desk, and <span class=\"vocab-trigger\" data-vocab=\"waltzed\">waltzed<\/span> into Nanjing University without taking the college entrance exam. There was also a writers' workshop. The disabled Misty poet, Mr. Che, would <span class=\"vocab-trigger\" data-vocab=\"swagger\">swagger<\/span> across campus with several beautiful female students always <span class=\"vocab-trigger\" data-vocab=\"trailing\">trailing<\/span> behind him. They would sit cross‑legged in the brightest corner of the campus dance hall, watching the dancers and searching for poetic inspiration. Among those followers was Amy, the economics student who would later become my wife in Canada—though I did not know it then.",

              "simpEn": "After transferring to Nanjing University, I made another big change: I stopped writing to Wang Feng in Xi'an. I felt that her heart had already flown to America with her boyfriend. I began to hate my own earlier unclear feelings. As payment, I started writing to Yang Yang every two weeks. I thanked her for her Go stones and her ultimate friendship. I promised to one day give her a set of jade stones in return. In my letters, I called her 'my dearest Hefei little bird.' Sometimes my words were a little sex-minded, because I described the special feeling of dancing with her. Yang Yang's grades at USTC remained excellent, near the top. That made me feel that she was getting revenge for me. I had lost, but my friend had won back for me.",

      "sections": [

          "sectionId": 1,
          "heading": "The Collapse of Spiritual Love",
          "paragraphs": [
            {
              "en": "After Dai Dai's spiritual love dream collapsed, he became deeply <span class=\"vocab-trigger\" data-vocab=\"dispirited\">dispirited<\/span>. Fortunately, he turned his grief into motivation and threw himself into studying English. English became his new lover. He prepared for the TOEFL and GRE. He too would go abroad. Go far away, to see if the life he dreamed of existed there. Go abroad! Go abroad! The sorrowful destiny of a generation of China's intellectual <span class=\"vocab-trigger\" data-vocab=\"elite\">elite<\/span>. At the gates of Nanjing University, I once saw people <span class=\"vocab-trigger\" data-vocab=\"queuing\">queuing<\/span> overnight with bedding rolls. They were lining up to register for the TOEFL.",
              "zh": "戴戴的精神恋梦想破灭后，一度变得非常消沉。好在他化悲痛为动力，也努力学起了英语。英语一度成了他另一个情人。他准备考托福和GRE。他也要出国去。去远方，看看还有没有他梦想中的人生。出国去！出国去！一代中国精英知识分子的悲伤归宿。在南大门口，有一天我看见了连夜带铺盖排长队的人们，一打听，原来他们是排托福报名。",
              "simpEn": "After Dai Dai's spiritual love dream ended, he became very sad. Luckily, he turned his sadness into energy and started studying English hard. English became his new lover. He prepared for the TOEFL and GRE exams. He would also go abroad. Go far away, to see if the life he dreamed of existed there. Go abroad! Go abroad! The sad fate of a generation of China's smartest people. At the Nanjing University gate, one day I saw people waiting in a long line overnight with their bedding. I asked and found out they were lining up to sign up for the TOEFL exam.",
              "simpZh": "戴戴的精神恋爱梦想破灭后，他变得非常消沉。好在他把悲伤化成了动力，开始努力学英语。英语成了他的新情人。他准备考托福和GRE。他也要出国。去远方，看看有没有他梦想的生活。出国去！出国去！一代中国精英知识分子的悲伤归宿。在南大门口，有一天我看见人们带着铺盖连夜排长队。一打听，原来他们在排队报名托福。"
            },
            {
              "en": "When Dai Dai graduated, he failed the graduate entrance exam. But a scholarly paper he had written caught the attention of two professors. One was at USTC, the other at Stanford. The first kept him at the university as a teaching assistant. The second offered to <span class=\"vocab-trigger\" data-vocab=\"sponsor\">sponsor<\/span> his studies in America, saying that although he had not been admitted to a master's program in China, he was essentially on par with the doctoral students he supervised at Stanford. Dai Dai, somewhat <span class=\"vocab-trigger\" data-vocab=\"resigned\">resigned<\/span>, remained at USTC. Nowadays, they say that to become a university lecturer in China, you need at least a doctorate.",
              "zh": "戴戴本科毕业的时候，一度考研失利。但却因为一篇学术论文受到了两个教授的赏识。一个是科大的，一个是美国斯坦福的。前者让他留校呆在了试验室，做起了助教。后者则表示愿意担保他去美国留学，并认为虽然他在科大没考上硕士，其实质上和他在美国带的博士水平也差不多。戴戴有点无奈地留在了科大。而现在，据说国内能留在高校当老师，可最起码要博士以上学位。",
              "simpEn": "When Dai Dai graduated, he failed the graduate entrance exam. But a research paper he wrote caught the attention of two professors. One was at USTC, the other at Stanford. The first kept him at the university as a teaching assistant. The second offered to pay for his studies in America, saying that although he had not been accepted into a master's program in China, he was basically as good as the PhD students he supervised at Stanford. Dai Dai, a bit unwilling, stayed at USTC. Now, they say to become a university lecturer in China, you need at least a doctorate.",
              "simpZh": "戴戴本科毕业时考研失利。但一篇学术论文引起了两个教授的注意。一个在科大，一个在斯坦福。前者让他留校做助教。后者表示愿意资助他去美国留学，说虽然他没考上硕士，但水平和他带的博士生差不多。戴戴无奈地留在了科大。现在据说在国内高校当老师，最起码要博士学历。"

            {
              "en": "Dai Dai always believed that this increasingly open society had <span class=\"vocab-trigger\" data-vocab=\"corrupted\">corrupted<\/span> his pure spiritual love. I wrote back, pointing out the complexity of human nature. Top student Wu Rou must have grown weary of Dai Dai's exaggerated, pretentious spiritual affair. Spiritual love, in my <span class=\"vocab-trigger\" data-vocab=\"lexicon\">lexicon<\/span>, was for a long time <span class=\"vocab-trigger\" data-vocab=\"synonymous\">synonymous<\/span> with ridiculousness and <span class=\"vocab-trigger\" data-vocab=\"perversion\">perversion<\/span>.",
              "zh": "戴戴一直觉得，是这个日益开放的社会污染了他纯真的精神恋爱。我则在信里向他指出人性的复杂性，状元吴柔一定是厌倦了戴戴的极其夸张做作的精神恋情。精神恋爱，在我词典里，一度就是可笑和变态的同义词。",
              "simpEn": "Dai Dai always believed that this increasingly open society had spoiled his pure spiritual love. I wrote back, pointing out that human nature is complex. The top student Wu Rou must have grown tired of Dai Dai's exaggerated, fake spiritual affair. Spiritual love, in my dictionary, was for a long time the same as ridiculous and twisted.",
              "simpZh": "戴戴一直觉得，是这个日益开放的社会污染了他纯真的精神恋爱。我回信指出人性的复杂性。状元吴柔一定是厌倦了戴戴夸张做作的精神恋情。精神恋爱，在我的词典里，一度就是可笑和变态的同义词。"

            {
              "en": "During that period, I had just finished <span class=\"vocab-trigger\" data-vocab=\"devouring\">devouring<\/span> Jin Yong's *The Deer and the Cauldron*, the <span class=\"vocab-trigger\" data-vocab=\"picaresque\">picaresque<\/span> tale of the brothel‑born rascal Wei Xiaobao. I felt that this kind of novel was far more <span class=\"vocab-trigger\" data-vocab=\"substantial\">substantial<\/span> than any Nobel Prize winner. It gave me the same feeling I had after reading Da Hai's poems—I no longer wanted to read Bei Dao, Gu Cheng, Eliot, or Rilke. I always felt that in art as in life, we should be more down‑to‑earth. I sent Dai Dai a set, telling him that Wei Xiaobao, that fake eunuch and scoundrel, had won so many beautiful wives by groping his way to them, singing dirty songs all the while. In this day and age, the Beijing hooligan novelists have declared: I'm a scoundrel, so who's afraid of me? My middle school Chinese teacher had called me a scoundrel, hadn't he? But after six years of university, I had grown into a man as solid as a mountain and as smooth as silk, yet I remained quite unremarkable—in Nanjing dialect, I just didn't have it. I had failed to live up to my teacher's earnest expectations.",
              "zh": "那段时间，我刚刚日夜攻读完金庸关于妓院子弟韦小宝传奇人生的小说《鹿鼎记》，我一度认为这种小说比诺贝尔文学奖作品实在多了。类似我读完大海的诗歌以后，就再不想读北岛或者顾城的诗歌或者艾略特和里尔克的诗歌一样。我总觉得无论是艺术还是人生，我们大家都要实在点好。我给戴戴寄了一套，告诉他，这个姓韦的无赖假太监那么多美女老婆，可都是他唱着十八摸一把一把摸来的。这年头，北京写流氓小说的爷们说了，我是流氓我怕谁？中学语文老师，不是说过我是流氓吗？结果，我都度过六年大学生涯了，早已长成了如山如绸的男人，却还是很不起眼，拿南京话就是根本不上路子，辜负了那老师对我的殷切期望。",
              "simpEn": "During that time, I had just finished reading Jin Yong's *The Deer and the Cauldron*, the adventurous story of the brothel-born rascal Wei Xiaobao. I thought this kind of novel was much more real than any Nobel Prize winner. It gave me the same feeling as reading Da Hai's poems—I no longer wanted to read Bei Dao, Gu Cheng, Eliot, or Rilke. I always felt that in art and in life, we should be more practical. I sent Dai Dai a set, telling him that Wei Xiaobao, that fake eunuch and scoundrel, had won so many beautiful wives by groping them, singing dirty songs. These days, the Beijing hooligan novelists say: I'm a scoundrel, so who's afraid of me? My middle school Chinese teacher had called me a scoundrel, hadn't he? But after six years of university, I had grown into a man as solid as a mountain and as smooth as silk, yet I was still quite unremarkable—in Nanjing dialect, I just didn't have it. I had failed to live up to my teacher's earnest hopes.",
              "simpZh": "那段时间我刚读完金庸的《鹿鼎记》，讲妓院出身的无赖韦小宝的传奇故事。我觉得这种小说比诺贝尔奖作品实在多了。就像读了大海的诗后不想再读北岛、顾城、艾略特、里尔克一样。我总觉得艺术和人生都要实在点。我给戴戴寄了一套，告诉他韦小宝那个假太监，那么多美女老婆都是唱着十八摸摸来的。这年头北京写流氓小说的爷们说了：我是流氓我怕谁？中学语文老师不是说过我是流氓吗？结果我读完六年大学，早已长成如山如绸的男人，却还是不起眼，南京话就是不上路子，辜负了老师的殷切期望。"

            {
              "en": "On the eve of my fourth year, I finally returned to USTC. I went to see Dai Dai and Lao Shui. On the long‑distance bus, I got carsick. After getting off, I nearly passed out at the Hefei Long‑Distance Bus Terminal, which I had not seen for years. I only met Dai Dai, who had just lost his love. One big discovery: his violin playing had improved considerably. When he told his roommate that I had once defeated Teacher Ning in a three‑game match, the roommate, who also loved Go, played with me all night. Without Yang Yang's guidance, and after years of neglect at Nanjing University, my Go skills had grown rusty. We played quickly, at least ten games. Like the aging, forgetful Master Nie Weiping, I made elementary mistakes. That night, I lost at least seven games.",
              "zh": "我即将大四的那个假期，我终于回去了一次科大。我是去看戴戴和老水。坐长途汽车的时候，我晕了车。下车后，一度要昏迷在久别了数年的合肥长途汽车总站。我只见到了刚刚失恋的戴戴。一大发现就是他的小提琴技术提高了不少。当他向他的舍友介绍我在当年曾经在少年班三番棋赢过宁老师后，他那也喜欢围棋的舍友和我下了一夜的棋。没有了杨杨的指导，我去南大后，我的围棋技术已经久疏沙场。我和他下得很快，一夜起码下了十盘。我还总是和年老昏花的聂大师一样，犯一些初级错误。那夜，我则输了起码七盘。",
              "simpEn": "On the break before my fourth year, I finally went back to USTC. I went to see Dai Dai and Lao Shui. On the long-distance bus, I got carsick. After getting off, I almost passed out at the Hefei bus station, which I hadn't seen for years. I only met Dai Dai, who had just lost his love. One big discovery: his violin playing had improved a lot. When he told his roommate that I had once beaten Teacher Ning in a three-game match, the roommate, who also loved Go, played with me all night. Without Yang Yang's guidance, and after years of not playing at Nanjing University, my Go skills had gotten rusty. We played quickly, at least ten games. Like the aging, forgetful Master Nie Weiping, I made basic mistakes. That night, I lost at least seven games.",
              "simpZh": "大四前的假期，我终于回了一次科大。去看戴戴和老水。坐长途汽车晕了车。下车后差点在多年未见的合肥长途汽车总站昏过去。只见到了刚失恋的戴戴。一大发现是他的小提琴进步了很多。当他告诉舍友我曾三番棋赢过宁老师，那也爱围棋的舍友和我下了一夜棋。没了杨杨指导，南大几年荒废，我的围棋技术生疏了。我们下得很快，一夜至少十盘。我和年老昏花的聂大师一样，犯初级错误。那夜我输了至少七盘。"
            },
            {
              "en": "Walking through the old USTC campus, I felt lost. I kept thinking that the figure of some girl ahead might be Yang Yang. I felt a kind of fear. But I knew I would not run into her here. Yang Yang had gone to Beijing for graduate school. Yet I truly feared bumping into her suddenly on the USTC campus. I would have preferred to see her in Beijing. In another city, we could dance again, play Go again—even kiss gently in the dark.",
              "zh": "走在昔日的科大校园里，我有一种迷路的感觉。我甚至总觉得前面某个女孩的身影可能就是杨杨。我在心里有那种恐惧感。但我知道我实际上是在这里碰不到她的。杨杨去北京读硕士了。但我真的恐惧在科大校园里与她突然相遇。我宁愿是在北京看见她。在另一个城市，再次跳舞或者下棋，哪怕是在夜色中轻轻接吻。",
              "simpEn": "Walking through the old USTC campus, I felt lost. I kept thinking that some girl ahead might be Yang Yang. I felt a kind of fear. But I knew I wouldn't run into her here. Yang Yang had gone to Beijing for graduate school. But I was really afraid of suddenly meeting her on the USTC campus. I would rather see her in Beijing. In another city, we could dance again, play Go again—even kiss gently in the dark.",
              "simpZh": "走在昔日的科大校园，我有种迷路的感觉。总觉得前面某个女孩的身影可能是杨杨。我心里有一种恐惧。但我知道在这里碰不到她。杨杨去北京读硕士了。但我真的害怕在科大校园突然遇见她。我宁愿在北京见她。在另一个城市，再次跳舞或下棋，哪怕是在夜色中轻轻接吻。"

            {
              "en": "Perhaps it was possible. I felt that even in my most fragmented dreams, Yang Yang's shadow would never be absent. She lived in my heart like a great master of art or philosophy—immense, dim. Though she was younger than me, she kept appearing in the letters I had saved, always in the image of such a master. She bit my lower lip and told me softly that my life was real, not all a dream. Although later, when I spoke of my experiences, I would sometimes omit my failed years at the USTC gifted class, I never forgot Yang Yang. I admired the calm and <span class=\"vocab-trigger\" data-vocab=\"maturity\">maturity<\/span> with which she played Go. She would lightly pick up a stone, place it, as if constructing her scientific life with the same certainty, the same masterful air. You couldn't help but respect her.",
              "zh": "也许有那样的可能，我总觉得我的人生，梦境中再残缺都不会少了杨杨的影子。她和无数艺术或者哲学大师一样在我心中活着。巨大着，灰暗着。虽然她年幼过我，但她在我保留的那些信中反复地出现，始终就是那么一个大师的形象。她咬着我的嘴唇，轻轻告诉我，我的人生，真实过，不全是梦境。虽然后来我对别人介绍我的经历时，我会有意无意地省去我失败的科大少年班经历，但我始终不会忘记杨杨。我仰慕她下围棋的时候的镇定和少年老成，那时候的她轻轻把棋子捻来放去，就如同她正认真地构造她的科学人生，一付胸有成竹的大师气势。你不服也不行。",
              "simpEn": "Perhaps it was possible. I felt that even in my most broken dreams, Yang Yang's shadow would never be missing. She lived in my heart like a great master of art or philosophy—huge, dim. Though she was younger than me, she kept appearing in the letters I had saved, always in the image of such a master. She bit my lower lip and told me softly that my life was real, not all a dream. Although later, when I talked about my experiences, I would sometimes leave out my failed years at the USTC gifted class, I never forgot Yang Yang. I admired the calm and grown‑up way she played Go. She would lightly pick up a stone and place it, as if building her scientific life with the same certainty, the same masterly manner. You couldn't help but respect her.",
              "simpZh": "也许有那种可能。我觉得我的人生，梦境再残缺都不会少了杨杨的影子。她像艺术或哲学大师一样在我心中活着，巨大而灰暗。虽然她比我小，但在保存的信里她反复出现，就是那样的大师形象。她咬着我的嘴唇轻轻告诉我，我的人生真实过，不全是梦。虽然后来介绍经历时我会省去科大少年班的失败，但我从没忘记杨杨。我仰慕她下围棋时的镇定和少年老成，她把棋子捻来放去，就像在认真构造她的科学人生，一副胸有成竹的大师气势。你不服不行。"

        {
          "sectionId": 3,
          "heading": "Lao Shui and Zhang Jing",
          "paragraphs": [
            {
              "en": "At USTC, I also did not see Lao Shui and his girlfriend Zhang Jing. They were supposed to be in Hefei that time. Lao Shui had been admitted to graduate school at USTC. Zhang Jing was assigned back to Xi'an, drifting through a research institute. What puzzled me was that Zhang Jing, who had always failed exams at USTC, somehow managed to complete a doctorate while working at that same institute. The two of them had suddenly gone to Zhang Jing's hometown, because her mother was gravely ill and wanted to see their engagement banquet. Later I learned that this was also the beginning of the end of their five‑year relationship. In Zhang Jing's hometown, Lao Shui contracted hepatitis, which might affect his performance in bed. Lao Shui believed that this minor sexual issue would not undermine their deep emotional foundation. But the beautiful intellectual Zhang Jing saw it differently. Zhang Jing was, in my eyes, the prettiest girl at USTC, and she sang with moving sweetness. The men who secretly admired her must have been <span class=\"vocab-trigger\" data-vocab=\"countless\">countless<\/span>.",
              "zh": "在科大，我也没见到老水和他的女友张景。本来，说他那段时间，他会在合肥的。老水考上了科大的研究生。张景则被分配回了西安，在一个科研所混日子。不过让我奇怪的是，一向在科大考试不及格的张景居然也在那个科研所在职读完了博士。他们俩那次是突然一起回了张景的老家，据说是因为张景的妈妈病重，要看他们的订婚宴。后来，我知道，那也是他们俩几乎五年的恋情开始决裂的时候。那次，在张景家乡，老水染上了肝炎，以后可能在床上雄风不在了。老水自以为认为这点性事并不妨碍他们俩多年的雄厚感情基础。但美女知识分子张景却不这么看。张景，几乎是我看见的，科大女孩里最漂亮的女生，她的歌还唱得悠悠动人。暗地里喜欢她的男人，应该也是成片成林的。",
              "simpEn": "At USTC, I also didn't see Lao Shui and his girlfriend Zhang Jing. They were supposed to be in Hefei that time. Lao Shui had been admitted to graduate school at USTC. Zhang Jing was sent back to Xi'an, drifting at a research institute. What puzzled me was that Zhang Jing, who had always failed exams at USTC, somehow finished a doctorate while working at that same institute. The two of them had suddenly gone to Zhang Jing's hometown, because her mother was very sick and wanted to see their engagement party. Later I learned that this was also the beginning of the end of their five‑year relationship. In Zhang Jing's hometown, Lao Shui caught hepatitis, which might affect his performance in bed. Lao Shui believed that this small sexual issue would not hurt their deep emotional foundation. But the beautiful intellectual Zhang Jing saw it differently. Zhang Jing was, in my eyes, the prettiest girl at USTC, and she sang with moving sweetness. The men who secretly liked her must have been countless.",
              "simpZh": "在科大，我也没见到老水和他女友张景。本来那段时间他们应该在合肥的。老水考上了科大研究生。张景分回西安，在一个科研所混日子。奇怪的是，一向考试不及格的张景居然在职读完了博士。他们俩突然一起回了张景老家，据说她妈妈病重要看订婚宴。后来我知道那也是五年恋情开始决裂的时候。在张景家乡，老水染上了肝炎，可能影响床上能力。老水以为这点小事不影响感情基础。但美女知识分子张景不这么看。张景是我见过的科大最漂亮的女生，歌也唱得悠悠动人。暗恋她的男人成片成林。"

            {
              "en": "Under my influence, Dai Dai began to furiously re‑examine his spiritual love affair to the melodies of Paganini. He regretted that during his long romance with top student Wu Rou, he had only occupied her spirit and not her body. Shortly after I left USTC, I received a letter from Dai Dai. He said that one day, in a USTC classroom, he had spotted a second‑year girl from Qingdao. During evening self‑study, he had walked straight in, knocked on her desk, and called her out. The bewildered girl thought this young teacher wanted to discuss her studies. Instead, Dai Dai announced in the hallway that he liked her and wanted to begin a love affair with her. That night, they went to a movie, and Dai Dai kissed her passionately. In his letter, he said they now kissed dozens of times a day. He had fallen in love with the act of kissing. It was different from his first kiss with Wang Feng in middle school—that had been too gentle, too childish. But now, because he was a teacher, he was still too embarrassed to go to bed with the second‑year girl.",
              "zh": "在我的鼓惑下，戴戴开始在帕格尼尼的旋律下愤怒地反思他的精神恋爱。他开始后悔在他和状元吴柔漫长的恋爱生涯中，只顾占领她的精神而没有去占领她的肉体。我离开科大不久，接到了戴戴的来信。说他一天，在科大教室里看上了一个二年级的青岛女生。他就在她在晚自习的时候，直接冲进去，敲了敲她的桌子叫她出来。那个茫然的二年级女生还以为这位年轻师长，要跟他说什么学习大计。没想到，戴戴在走廊上对她公布，说自己喜欢她，想和她有个爱情的开始。当晚，他们俩去看电影，戴戴就激烈地吻了她。他在信里说，现在，他们俩天天要接吻几十次。他喜欢上了接吻的感觉。不同于他在中学时候初恋时候和王凤的吻。那时候的吻太斯文、太幼稚。不过他现在觉得他现在的身份是老师，所以还不好意思和二年级的学生妹妹马上上床。",
              "simpEn": "Under my influence, Dai Dai began to angrily rethink his spiritual love affair to the music of Paganini. He regretted that during his long romance with top student Wu Rou, he had only occupied her spirit and not her body. Shortly after I left USTC, I received a letter from Dai Dai. He said that one day, in a USTC classroom, he had spotted a second‑year girl from Qingdao. During evening self‑study, he had walked straight in, knocked on her desk, and called her out. The confused girl thought this young teacher wanted to talk about her studies. Instead, Dai Dai announced in the hallway that he liked her and wanted to start a love affair with her. That night, they went to a movie, and Dai Dai kissed her passionately. In his letter, he said they now kissed dozens of times a day. He had fallen in love with the act of kissing. It was different from his first kiss with Wang Feng in middle school—that had been too gentle, too childish. But now, because he was a teacher, he was still too shy to go to bed with the second‑year girl.",
              "simpZh": "在我的鼓动下，戴戴开始听着帕格尼尼愤怒地反思他的精神恋爱。他后悔和状元吴柔漫长的恋爱中只占领了她的精神没有占领肉体。我离开科大不久接到戴戴来信。说他在教室看上一个二年级的青岛女生。晚自习时他直接冲进去敲她桌子叫她出来。那女生以为这年轻师长要谈学习。没想到戴戴在走廊宣布喜欢她，要和她恋爱。当晚他们去看电影，戴戴激烈地吻了她。信里说现在每天接吻几十次，他喜欢上了接吻。这和中学时与王凤的初吻不同，那次太斯文太幼稚。但现在他是老师，还不好意思和二年级女生上床。"
            },
            {
              "en": "But he said that day would come. He would make their love complete. Reading this, I suddenly felt happy for Dai Dai. Mature people should have mature love and lives. No matter how deep the <span class=\"vocab-trigger\" data-vocab=\"abyss\">abyss<\/span>, no matter how treacherous the shallows, even if it truly were a field of landmines, one should not retreat.",
              "zh": "但他说，会有那么一天，他会让他们的爱情变得完整。看到这里，忽然间我觉得我挺替戴戴高兴的。成熟的人应该拥有成熟的爱和生活。不管里面是深渊还是浅滩，就是真是地雷阵也不应该退缩。",
              "simpEn": "But he said that day would come. He would make their love complete. Reading this, I suddenly felt happy for Dai Dai. Mature people should have mature love and lives. No matter how deep the hole, no matter how dangerous the shallow waters, even if it truly were a field of landmines, one should not turn back.",
              "simpZh": "但他会说有一天会让爱情完整。看到这里我忽然替戴戴高兴。成熟的人应该有成熟的爱和生活。不管是深渊还是浅滩，哪怕是地雷阵，也不该退缩。"

          "paragraphs": [
            {
              "en": "It was just before graduation that I truly felt like a broken boat, about to sink in the Yangtze River outside Nanjing. When you truly love someone, you realise how broken you are. It was then that I met the woman who was destined to be mine. I called her my Map. The traces of my life never stray far from that map. She was not Yuan Xing, nor Yang Yang, nor Liu Bing. In my dreams, whenever I saw the earth first, and then a map, it meant I was dreaming of her. Because I knew she would appear at the edge of my map. One meaning of my life was to search to the ends of the earth to find her—and her body.",
              "zh": "也就是在我快毕业的那年，我才觉得自己真正变成了一条破船，在南京边的长江里，就要沉没了。真正爱一个人，你就会觉得自己其实很破。就那时候，我遇见了我生命中必然来到的女人，我叫她我的地图。我的人生踪迹总是出不了那块地图。她不是袁星，也不是杨杨，更不是刘兵。我总在梦里先梦见地球然后梦见地图，那就表示我梦见了她。因为我知道，她一定会出现在我的地图的尽头。因为，我的人生的一种含义，就是踏遍天涯海角，我也要找到她，和她的身体。",
              "simpEn": "It was just before graduation that I truly felt like a broken boat, about to sink in the Yangtze River outside Nanjing. When you truly love someone, you realize how broken you are. It was then that I met the woman who was destined to be mine. I called her my Map. The traces of my life never go far from that map. She was not Yuan Xing, nor Yang Yang, nor Liu Bing. In my dreams, whenever I saw the earth first, and then a map, it meant I was dreaming of her. Because I knew she would appear at the edge of my map. One meaning of my life was to search to the ends of the earth to find her—and her body.",
              "simpZh": "就在快毕业那年，我才觉得自己变成了一条破船，要在南京边的长江里沉没了。真正爱一个人，你会觉得自己很破。就在那时我遇见了命中注定的女人，我叫她我的地图。我的人生踪迹总是出不了那块地图。她不是袁星，不是杨杨，也不是刘兵。我在梦里先梦见地球然后梦见地图，那就是梦见她了。因为我知道她一定出现在地图的尽头。我人生的一个意义就是走遍天涯海角找到她——和她的身体。"
            },
            {
              "en": "Although I shared my first kiss with one woman, and my first sexual experience with another, I always felt that these were merely military exercises in the battle of my life. My body, my dreams, my eternal, fragmented novel in which sorrow and happiness are synonyms—all were for her, my Map.",
              "zh": "虽然，我和另一个女人第一次接吻，又和另一个女人第一次做爱。但我总以为，那些只是我的人生战斗中的一些军事演习。我的身体，我的梦境，我的永远的，破碎的，描写快乐和悲伤是同义词的小说，都是为她，我的地图而准备。",
              "simpEn": "Although I shared my first kiss with one woman, and my first time with another, I always felt that these were just practice fights in the battle of my life. My body, my dreams, my eternal, broken novel in which sorrow and happiness are the same—all were for her, my Map.",
              "simpZh": "虽然我和一个女人初吻，和另一个女人初夜，但我总觉那些只是人生战斗中的军事演习。我的身体、我的梦境、我那永远的破碎的小说——快乐和悲伤同义词——都是为她，我的地图而准备。"

        {
          "sectionId": 5,
          "heading": "Graduation and Job Assignment",
          "paragraphs": [
            {
              "en": "Just before the 1990s arrived, I was about to leave Nanjing University. Such an uprooting graduation made me deeply uncomfortable. The department wanted to send me back to Xi'an. Their reason: I should go back to care for my aging parents. The former department chair had been my mother's middle school classmate, but he was now retired. I went to see him anyway, to ask for his help in not being assigned back to Xi'an. For some reason, I did not want to return to that ancient loess city. Perhaps I felt I could not face my elders. The former prodigy had become an ordinary university graduate—a fact that still stung a little.",
              "zh": "进入二十世纪九十年代前夕，我终于要离开南京大学了。这样的斩根似的毕业，一度让我感觉非常不舒服。系里开始是要把我发配回西安。理由是我应该回去照顾我日益年迈的父母。曾经的系主任是我妈妈的中学同学，如今他退休了。结果，我还是去找了他，要他帮忙不要让我分回西安。不知道为什么，我不想回到那个黄土古城西安去。也许，我总觉得有一种无脸见江东父老的感觉。昔日的神童变成了一个普通大学毕业生，这其实多少还是有点让我失落的。",
              "simpEn": "Just before the 1990s arrived, I was about to leave Nanjing University. This uprooting graduation made me very uncomfortable. The department wanted to send me back to Xi'an. Their reason: I should go back to take care of my aging parents. The former department chair had been my mother's middle school classmate, but he was now retired. I went to see him anyway, to ask for his help in not being assigned back to Xi'an. For some reason, I didn't want to return to that ancient loess city. Perhaps I felt I couldn't face my elders. The former prodigy had become an ordinary university graduate—a fact that still hurt a little.",
              "simpZh": "进入九十年代前夕，我终于要离开南大了。这种连根拔起的毕业让我很不舒服。系里要把我发配回西安，理由是我该回去照顾年迈的父母。前系主任是妈妈的中学同学，但已退休。我还是去找他帮忙不要分回西安。不知为什么我不想回到那个黄土古城。也许觉得无颜见江东父老。昔日神童变成普通大学毕业生，这多少让我失落。"
            },
            {
              "en": "The former department chair used his influence. Two options were offered: work at the Nanjing Evening News, or teach Chinese at a university in Beijing. Perhaps because I had betrayed Zhang Taohua, my advisor treated me with unusual kindness and care. My inexplicable attachment to Nanjing made me choose the newspaper job.",
              "zh": "前系主任做了工作。毕业分配，我被告知有两个地方可去，到南京的晚报和一个北京的大学去教中文。也许因为我出卖过张桃花，辅导员对我挺亲切也挺照顾。对南京莫名其妙的留恋让我选择了在晚报的工作。",
              "simpEn": "The former department chair used his influence. Two options were offered: work at the Nanjing Evening News, or teach Chinese at a university in Beijing. Perhaps because I had betrayed Zhang Taohua, my advisor treated me with unusual kindness and care. My strange attachment to Nanjing made me choose the newspaper job.",
              "simpZh": "前系主任做了工作。毕业分配两个地方：去南京晚报或北京一所大学教中文。也许因为我出卖过张桃花，辅导员对我挺亲切。对南京莫名的留恋让我选了晚报的工作。"
            },
            {
              "en": "Zhang Taohua was admitted to a master's program at Beijing Broadcasting Institute. He said he would break into television and become a program host. That year, his basketball‑player girlfriend, during a study trip to the United States, grabbed her suitcase and fled from the hotel, becoming a refugee. Her asylum claim was said to be that she could not endure the university's crude interference in her sex life—publicly disciplining her simply because she had sex with her boyfriend in the dormitory. She had brought the original disciplinary notice with her, in black and white, to America. Later she successfully obtained a green card and settled there. She had planned this for a long time, without telling Zhang Taohua. Their love ended completely.",
              "zh": "张桃花则考上了北广的硕士。他说要进军电视台，去当节目主持人。那年，他的篮球女友在一次去美国的考察活动的途中，拎起皮箱从宾馆逃跑了，成了难民。传说她的上诉理由是，她不能忍受大学曾经粗暴地干涉过她的性生活。仅仅因为她和她男朋友在宿舍里做爱就公开处分了她。她把那处分的原件也白纸黑字地带去了美国。后来她成功地拿到绿卡居留在了美国。这件事情她预谋很久，居然没有告诉张桃花。所以，他们的爱情也因此完全打上了句号。",
              "simpEn": "Zhang Taohua was admitted to a master's program at Beijing Broadcasting Institute. He said he would break into television and become a program host. That year, his basketball-player girlfriend, during a study trip to the United States, grabbed her suitcase and ran away from the hotel, becoming a refugee. Her asylum claim was said to be that she could not stand the university's rough interference in her sex life—publicly punishing her just because she had sex with her boyfriend in the dorm. She had brought the original disciplinary notice with her, in black and white, to America. Later she successfully got a green card and settled there. She had planned this for a long time, without telling Zhang Taohua. So their love completely ended.",
              "simpZh": "张桃花考上了北广硕士，说要进军电视台当主持人。那年他的篮球女友去美国考察途中，拎起皮箱从宾馆跑了，成了难民。她的上诉理由据说是不能忍受大学粗暴干涉她的性生活——只因在宿舍和男友做爱就公开处分她。她把处分原件白纸黑字带去了美国。后来成功拿到绿卡留在了美国。这事她预谋很久，没告诉张桃花。他们的爱情因此完全画上了句号。"
            },
            {
              "en": "Hu Jie, before graduation, played tennis obsessively. He was already showing his business talent. He even hired a former national women's champion to run tennis training camps at Nanjing University. He made a good profit but ended up owing the coach a considerable sum. A debt collection notice was pasted on our dormitory door. He also fell for an American female student. He would accompany her in gentle tennis matches, dashing all over the court, retrieving every ball.",
              "zh": "胡杰在毕业前夕，则疯狂地打起了网球。那时候，他就显示出了他的经商才华。他还请来前女国手在南大开网球训练班。结果，他自己是赚了不少，却也欠了那女教练不少的培训费，被人家一张追债的纸条贴在了我们宿舍的门口。还有，他那时候还喜欢上了一个美国女留学生。他拼命陪她温柔地打球，前后场大范围的跑动扑救。",
              "simpEn": "Hu Jie, before graduation, played tennis obsessively. He was already showing his business talent. He even hired a former national women's champion to run tennis training camps at Nanjing University. He made a good profit but ended up owing the coach a lot of money. A debt collection notice was pasted on our dormitory door. He also fell for an American female student. He would play gentle tennis with her, running all over the court to get every ball.",
              "simpZh": "胡杰毕业前夕疯狂打网球，已显出经商才华。他还请前女国手在南大开网球训练班。自己赚了不少，但也欠了教练不少培训费，追债条贴在了宿舍门口。他还喜欢上了一个美国女留学生，拼命陪她温柔地打球，满场跑动救球。"

            {

              "zh": "那个不起眼的美国女孩，竟是美国德州著名石油大富翁的女儿。她和胡杰的婚事后来弄得挺复杂也挺轰动。胡杰的一个在南大读研究生的女友还追杀胡杰到了系里，说她被胡杰骗财骗色。",
              "simpEn": "That unremarkable American girl turned out to be the daughter of a Texas oil tycoon. Her marriage to Hu Jie later became quite complicated and sensational. One of Hu Jie's former girlfriends, now a graduate student at Nanjing University, chased him all the way to the department, accusing him of cheating her out of money and sex.",
              "simpZh": "那个不起眼的美国女孩竟是德州石油大富翁的女儿。她和胡杰的婚事后来闹得很复杂轰动。胡杰的一个研究生女友还追杀到系里，说她被骗财骗色。"

            {
              "en": "The Texas oil tycoon strongly opposed the cross‑cultural romance and sent lawyers to Nanjing to force Hu Jie to sign a <span class=\"vocab-trigger\" data-vocab=\"prenuptial agreement\">prenuptial agreement<\/span>. The main clause was that no matter what, he would never share in the family's wealth. Hu Jie signed casually, declaring that he was marrying for love, not money. In the late 1980s, people were not yet so money‑worshipping. Marrying for money was not mainstream. I knew, in fact, that he wasn't marrying the little American beauty for love—he wanted to go abroad. He was determined to realise his American dream.",
              "zh": "德州石油大富翁非常反对这宗异国情缘，还派律师代表专程赶来了南京，逼胡杰签了一份婚前协议。那里面的主要内容就是，无论如何，他都没机会能分享他们家的任何财富。胡杰大大咧咧地签了字，说自己根本是因为爱情而不是钱。八十年代末，的确大家还没怎么拜金。为了金钱而结婚的人不是主流。我知道，实际上，他和美国小美女结婚，的确不是为了钱，是为了出国。他一定要圆他的美国梦。",
              "simpEn": "The Texas oil tycoon strongly opposed the cross-cultural romance and sent lawyers to Nanjing to force Hu Jie to sign a prenuptial agreement. The main point was that no matter what, he would never share in the family's wealth. Hu Jie signed casually, saying he was marrying for love, not money. In the late 1980s, people weren't yet so money-worshipping. Marrying for money was not mainstream. I knew, in fact, that he wasn't marrying the little American beauty for love—he wanted to go abroad. He was determined to realize his American dream.",
              "simpZh": "德州石油大富翁反对这异国情缘，派律师来南京逼胡杰签婚前协议。主要内容是：无论如何他都不能分享家族财富。胡杰大大咧咧签了，说自己为爱情不是为钱。八十年代末大家还没那么拜金，为钱结婚不是主流。我知道他其实不是为了爱情，是为了出国。他一定要圆美国梦。"
            },
            {
              "en": "After receiving their marriage certificate, Hu Jie finally got his visa and successfully \"married\" his way to America. Before he left, we played a five‑set tennis match. Hu Jie still could not achieve his first victory over me on Chinese soil. In truth, I preferred playing doubles with him. For a time, our partnership was invincible in the Nanjing university tennis scene, holding the top doubles spot on the Nanjing Intercollegiate League team. Strangely, neither of us was particularly strong in singles, but when we played together, we always exceeded ourselves.",

              "simpZh": "领证后胡杰等来了签证，顺利嫁去了美国。临别前我们在网球场大战五盘。胡杰还是没能在中国的土地上首胜我。其实我更喜欢和他配双打。一度我们无敌于南京高校网球界，盘踞联队首席双打。奇怪的是我们单打都不强，配起双打却总有超水平发挥。"

            {
              "en": "But our happiness was short-lived. A wealthy Hong Kong businessman, whom everyone called Fatty, saw Man Mei and wanted her. He offered her a deal: come to Shenzhen with him for one year, and he would buy her parents a three‑bedroom apartment in Nanjing. She couldn't refuse. Her family lived in a tiny two‑room flat near the Confucius Temple. The apartment was a dream she never thought could come true. So she left. She asked me to wait for her. She said it was just one year. I agreed. I was young. I was foolish. I believed her.",

              "en": "That year felt like a decade. I waited. I wrote letters. She called sometimes. But I could hear in her voice that something had changed. She was using drugs. Fatty had introduced her to them. She said it was nothing. She said she could quit anytime. But she couldn't. And I couldn't help her. I was just a small newspaper reporter. I didn't have the money or the power to save her from that world. I felt powerless. I felt ashamed. I had failed to protect Han Feng in the cornfield. Now I was failing to protect Man Mei. The same cowardice, the same paralysis. I hated myself.",
              "zh": "那一年像是十年。我等。我写信。她有时打来电话。但我能从她的声音里听出有些东西变了。她开始吸毒。胖子带她入的门。她说没什么。说她随时能戒。但她戒不了。我也帮不了她。我只是个小报记者。我没有钱，没有力量把她从那个世界救出来。我感到无能为力。我感到羞耻。我没能在玉米地里保护好寒风。现在又没能保护好满妹。同样的懦弱，同样的瘫软。我恨自己。",

              "simpZh": "一年期满，她没有回来。她又要一年。然后又是一年。我一直等。不知道为什么。也许因为我相信等得够久她就会回来。也许因为我也无处可去。也许因为等待比活着容易。"

              "zh": "她选择了他。或者更准确地说，选择了毒品、金钱、安逸的生活。我没法比。我一个人回了南京。飞机上，我望着窗外的云，思考做男人意味着什么。我又失败了。我会一直失败。这就是我的命运。",

              "simpZh": "她选择了他。或者更准确地说，选择了毒品、金钱、安逸的生活。我没法比。我一个人回了南京。飞机上望着窗外的云，思考做男人意味着什么。我又失败了。我会一直失败。这就是我的命运。"

              "zh": "但生活还在继续。胡杰从美国回来了，离了婚，破了产。我们一起做生意。我赚了钱。我买了一辆红色宝马。我约会其他女人。我试图忘记满妹。但我做不到。她就像我心中的一个影子，一张我永远无法停止追寻的地图。多年后，我会再次找到她，在世界上最奇怪的地方——多伦多的一家脱衣舞俱乐部。但那是另一个故事了。",
