    {
      "id": 5,
      "title": "Chapter Five: Exile",
      "sections": [
        {
          "sectionId": 1,
          "heading": "The First Real Snow",
          "paragraphs": [
            {
              "en": "Tonight, Toronto's first real snow of winter finally began to fall past midnight—snow mixed with sleet, tapping against the roof and the window. The past, solid as a mountain, smooth as silk, and white as snow, does not easily end. Snow may melt, but as long as you live, the past never truly closes. Every yesterday is an endless <span class=\"vocab-trigger\" data-vocab=\"sequel\">sequel<\/span>.",
              "zh": "多伦多今天冬天的第一场真正的大雪终于在夜半飘落，里面夹着雪珠，沙沙地打在屋顶和窗口。往事如山如绸还也如雪。但是，我知道，雪可以融化，而只要你活着，往事却永远不会轻易结束。任何一个昨天，都是绵绵续集。",
              "simpEn": "Tonight, Toronto's first real snow of winter finally began to fall after midnight—snow mixed with sleet, tapping on the roof and window. The past, solid as a mountain, smooth as silk, and white as snow, does not easily end. Snow can melt, but as long as you live, the past never really closes. Every yesterday is an endless continuation.",
              "simpZh": "多伦多冬天的第一场真正的大雪终于在半夜飘落，夹着雪珠，沙沙地打在屋顶和窗户上。往事如山如绸如雪。但我知道，雪会融化，可只要你活着，往事永远不会轻易结束。每一个昨天都是绵绵的续集。"
            },
            {
              "en": "After I finally bade farewell to <span class=\"vocab-trigger\" data-vocab=\"virginity\">virginity<\/span>, I received a call from Yang Yang. She, too, had been admitted to Harvard on a full scholarship. She would go to America and join her boyfriend, their two swords united. She said she would return to Wuhan before leaving, and then wanted to stop by Nanjing to see me. Her tone had grown very mature. She was ready to cross the ocean and begin a new career.",
              "zh": "在我终于告别童男人生后，接到了杨杨的电话，说她也已经申请到了哈佛大学的全奖，也要去美国和她的男朋友双剑合璧了。她说她临走前要回一下武汉，然后想顺道来南京看我。她说这些话语的口气给我感觉她已经特别特别成熟。完全可以去漂洋过海，做一番新的事业了。",
              "simpEn": "After I finally said goodbye to being a virgin, I received a call from Yang Yang. She, too, had been admitted to Harvard on a full scholarship. She would go to America and join her boyfriend, their two swords together. She said she would go back to Wuhan before leaving, and then wanted to stop by Nanjing to see me. Her tone had become very mature. She was ready to cross the ocean and start a new career.",
              "simpZh": "在我终于告别处男身后，接到了杨杨的电话。她也申请到了哈佛的全奖，要去美国和男朋友双剑合璧了。她说临走前回武汉，然后顺道来南京看我。她的语气已经非常成熟。她准备好漂洋过海，做一番新事业了。"
            },
            {
              "en": "Suddenly, a thought struck me: why hadn't it been Yang Yang with whom I shared my first time? I had to admit that although Yang Yang and I had kissed briefly, the main content of our relationship was still noble friendship. And again, the words came back to me: \"When a man and a woman like each other, they should go to bed together. Otherwise, they cheat their own lives.\" This sentence always surfaced most easily when I thought of Yang Yang. I knew that perhaps Yang Yang would not have wanted my so‑called first time. But I firmly believed that, given our boundless friendship, if I truly knelt and begged, I could have succeeded.",
              "zh": "忽然间，我有了那个念头，那就是我怎么不是和杨杨有我的第一次。虽然，我必须承认，我和杨杨虽然草草地接过吻，但最主要的内容还是高尚的友谊和友情。于是，我又想起那句话：\"我觉得两个相互喜欢的男女，一定应该上床，不然对不起自己的人生。\"其实这句话，总是在我想到杨杨的时候会最容易浮现在我的脑海里。我知道，也许，人家杨杨不会要我的这所谓第一次。但是，我坚信，凭和她那无边无际的友谊，如果我真的肯跪下来求她的话，那我是可以得逞的。",
              "simpEn": "Suddenly, a thought struck me: why hadn't it been Yang Yang that I had my first time with? I had to admit that although Yang Yang and I had briefly kissed, the main thing between us was still noble friendship. And again, the words came back to me: 'When a man and a woman like each other, they should go to bed together. Otherwise, they cheat their own lives.' This sentence always came to mind most easily when I thought of Yang Yang. I knew that perhaps Yang Yang wouldn't want my so-called first time. But I firmly believed that, given our endless friendship, if I really knelt and begged, I could succeed.",
              "simpZh": "忽然间我冒出一个念头：怎么不是和杨杨有第一次呢？我必须承认，虽然我们草草接过吻，但主要还是高尚的友谊。我又想起那句话：\"两个相互喜欢的男女一定要上床，不然对不起自己的人生。\"这句话总是在想到杨杨时最容易浮现。我知道杨杨也许不会要我的第一次。但我坚信，凭我们无边的友谊，如果我真的跪下求她，我能得逞。"
            },
            {
              "en": "Or, I could kneel before her when she came to Nanjing and beg her to give me my second time. I didn't know if Yang Yang and her boyfriend had already been intimate. But I sensed that Yang Yang was the old‑fashioned type who would save her first time for her wedding night.",
              "zh": "或者，我可以在她来南京的时候，跪下来求她，让她给我我人生的第二次。我不知道杨杨和她的男朋友是否已经有过关系。但我感觉杨杨应该还是那种把她的第一次要留给她的新婚夜的老套女人。",
              "simpEn": "Or, I could kneel before her when she came to Nanjing and beg her to give me my second time. I didn't know if Yang Yang and her boyfriend had already been together. But I sensed that Yang Yang was the old-fashioned type who would save her first time for her wedding night.",
              "simpZh": "或者，可以在她来南京时跪下求她给我第二次。我不知道杨杨和男友是否已有关系。但我感觉她是那种把第一次留给新婚夜的老套女人。"
            },
            {
              "en": "That way, my second time might have been Yang Yang's first time. In truth, what difference is there between a first and a second? I wasn't a woman. And even if I were, this wasn't the feudal era anymore. But I did not do it. I told Yang Yang that during her planned visit to Nanjing, I would be away on a business trip to Yancheng. I lied. Though I did indeed go to Yancheng, I took leave to go there.",
              "zh": "那样，我的第二次就有可能是杨杨的第一次。事实上，第一次和第二次又有多少区别呢。我又不是女人。即使是女人又怎样？现在又不是万恶的封建社会。但我没有那样去做。我告诉杨杨，在她安排的行程的南京日期中，我要去盐城出差。我撒了谎。虽然我真的去了盐城，但我是请假去的盐城。",
              "simpEn": "That way, my second time might have been Yang Yang's first time. In truth, what difference is there between a first and a second? I wasn't a woman. And even if I were, this isn't the evil feudal era anymore. But I didn't do it. I told Yang Yang that during her planned visit to Nanjing, I would be away on a business trip to Yancheng. I lied. Though I did indeed go to Yancheng, I took time off to go there.",
              "simpZh": "那样我的第二次可能是杨杨的第一次。第一次和第二次又有多少区别？我又不是女人。就算是女人又怎样？现在又不是万恶的封建社会。但我没那么做。我告诉杨杨她来南京时我要去盐城出差。我撒了谎。虽然我真的去了盐城，但我是请假去的。"

              "simpZh": "我问：\"还好吧？\"她说：\"好呀。\"我说：\"那上次怎么给我吃药？让我白开房白等一夜。\"她说：\"会有其他夜晚的。那天我不行。\"我说：\"你变了！\"她说：\"没变，和以前一样。\""

            {
              "en": "With that, she leaned over and kissed me lightly. It felt like a gentle breeze brushing my face. Then she suddenly said: \"Huang Xiang, when will you write me a poem?\" We had been together so long, and this was the first time she had asked.",
              "zh": "说完这话，她附身过来，轻轻地吻了我一下。那感觉，像是风轻轻地吹了我的脸面一下。吻我的时候，她突然说：\"黄翔，什么时候给我写首诗。\"和她在一起这么久，我还是第一次听见她对我提这种要求。",
              "simpEn": "With that, she leaned over and kissed me lightly. It felt like a gentle breeze brushing my face. Then she suddenly said: 'Huang Xiang, when will you write me a poem?' We had been together so long, and this was the first time she had asked.",

              "simpEn": "That day, we ate duck blood soup and stinky tofu at a street stall in Xinjiekou. Then she hurried away, saying her mother was sick. I knew it was a lie, but I didn't expose her.",
              "simpZh": "那天我们在新街口地摊上吃鸭血汤、臭豆腐。然后她急匆匆走了，说她妈妈病了。我知道是谎话，但没当面揭穿。"

              "zh": "在喝汤的时候，我试图去构思那首满妹妹给我要的诗。我想了半天。觉得自己好像写不出任何和诗接近的语言。我决定回去后要温习下大海的口语诗和陈上的抽象诗。我还想，那两种诗歌要是能结合起来就好了。就像满妹妹和刘兵结合起来，一定是一首世界上最完美的诗歌。",
              "simpEn": "As I ate my soup, I tried to write the poem Man Mei had asked for. I thought hard. I realized I could no longer write anything like poetry. I decided to go home and review Da Hai's plain-language poems and Chen Shang's abstract poems. I thought that if those two styles could be combined, like Man Mei and Liu Bing combined, they would make the world's most perfect poem.",
              "simpZh": "喝汤时我试图构思满妹要的那首诗。想了半天，觉得自己写不出任何像诗的东西。决定回去温习大海的口语诗和陈上的抽象诗。我想那两种诗歌如果能结合起来，就像满妹和刘兵结合起来，一定是世界上最完美的诗歌。"

            {
              "en": "A few days later, I cornered her at a newly opened high‑end nightclub in Nanjing. Those flashy, glitzy places were just beginning to appear in the city. Karaoke and disco halls were also new. The colleague who had forgotten to tell me said I could find Man Mei there. I knew her new man—or new boyfriend—would be there too.",
              "zh": "几天后，我在南京新开的一个高档夜总会里堵住了她。那时候，南京城还刚刚开始有那些灯红酒绿的东西。卡拉 OK 和风暴的厅也都是刚刚抢滩南京。满妹的那个上次忘记通知我的小姐妹叫我来这里找她。我知道她的新男人或者新男朋友一定就在这里。",
              "simpEn": "A few days later, I caught up with her at a newly opened high-end nightclub in Nanjing. Those flashy, glitzy places were just beginning to appear in the city. Karaoke and disco halls were also new. The coworker who had forgotten to tell me said I could find Man Mei there. I knew her new man—or new boyfriend—would be there too.",
              "simpZh": "几天后我在南京一个新开的高档夜总会堵住了她。那时南京刚有那些灯红酒绿的地方。卡拉OK和迪厅也刚刚出现。那个上次忘记通知我的姐妹叫我来这里找她。我知道她的新男人或新男友一定也在。"

              "zh": "那天，我看见她的嘴唇在灰暗的灯下发着一种惨淡的绿色。我觉得在这样的环境里，她则是一个让我陌生的幽灵。那天，满妹一直是一个人在舞池里狂跳迪斯科，还把头发一会甩到脸上，一会又甩到肩上。虽然她一直是一个人在跳，但我知道，在黑暗中，一定也坐着一个和我一样注视着她的男人。",
              "simpEn": "That day, I saw that her lips, in the dim light, were a sickly green. In that environment, she was a stranger to me, a ghost. All evening, Man Mei danced alone in the disco, throwing her hair over her face, then over her shoulders. Though she danced alone, I knew that somewhere in the darkness, a man was watching her just as I was.",
              "simpZh": "那天我看见她嘴唇在昏暗灯光下是惨淡的绿色。在那环境里，她像个陌生的幽灵。她一直在舞池里狂跳迪斯科，把头发甩到脸上又甩到肩上。虽然她一个人在跳，但我知道黑暗中一定也有个男人像我一样注视着她。"

              "simpEn": "I sat for a long time. I knew Man Mei must have seen me. But her gaze swept past me as if I were any other stranger. I ordered a drink, drank half, and couldn't finish it.",

            {
              "en": "I walked up and took Man Mei's hand. \"It's time,\" I said. \"I'm taking you home.\" No sooner had the words left my mouth than I heard a familiar whistling sound in my ear. It was too familiar—like the wind in the cornfield years ago, blowing and blowing. In that moment, I thought of Han Feng. Perhaps Han Feng was a kind of wind. First she was wind, and then she was my sorrowful middle school classmate. Those corn stalks had grown tall, as crisp as poetry. I heard the sound of a bottle breaking. I fell. I fell very slowly, like a slow‑motion film.",

              "simpZh": "我走上前拉住满妹的手说：\"时间到了，我要带你回家。\"话音刚落，就听见耳边一阵熟悉的风声。太熟悉了——像多年前玉米地里的风，吹啊吹啊。那一刻我想起了寒风。也许寒风就是一种风，她首先是风，然后才是我悲伤的中学同学。那些玉米长高了，像诗歌一样清脆。我听见酒瓶破碎的声音。我倒下去，很慢很慢，像电影慢镜头。"

              "en": "In the seconds it took to fall, I knew clearly that I had been struck by a bottle. When I finally lay on the ground, I realised that unconsciousness is also a kind of dreaming—and those dreams of unconsciousness might be even purer.",

              "simpEn": "In the seconds it took to fall, I knew clearly that I had been hit by a bottle. When I finally lay on the ground, I realized that unconsciousness is also a kind of dreaming—and those dreams of unconsciousness might be even purer.",
              "simpZh": "倒下的那几秒里，我清醒地明白是被酒瓶打倒了。等真的趴在地上，我发现昏迷也是做梦，昏迷的梦可能更纯粹。"

              "simpEn": "When they left together, I still hadn't spoken. I knew the fear and anger hidden in my heart. I hated it when people attacked my head. My courage index had been low since middle school, thanks to that kind of attack. After they left, I thought for a long time. I didn't believe Man Mei was the kind of woman who would give herself up for money. What I had admired in her was her simplicity. Perhaps there was another reason.",
              "simpZh": "直到他们一起离开，我也没怎么说话。我知道心里藏着胆怯和愤怒。我讨厌别人攻击我的头。我的勇气指数从中学起就因那种攻击而很低。他们走后我想了很久，觉得满妹不应该是那种见钱眼开的女人。我欣赏的就是她的纯朴。也许还有别的原因。"

        {

          "heading": "Another Blow",
          "paragraphs": [
            {
              "en": "I stayed in the hospital for three days. I had many dreams. But not one of them was about Man Mei. I knew who had taken Man Mei from me. It wasn't really that Hong Kong sissy with a few stinking coins and a few thugs. It was this rapidly changing new era. In the new era, poetry is useless. Dreams are useless. Even roses may be useless. In the new era, thirty thousand yuan—things like that—may be what matter.",
              "zh": "我在那医院里一共住了三天。三天里，我做了很多梦。但没有一个梦是关于满妹。我知道是谁从我身边带走了满妹，不能说就是那个有几个臭钱几个手下的香港娘娘腔男人，应该说是这个急剧变化的新时代。新时代里，诗歌是没用的，梦境也是没用的。连玫瑰，可能都是没用的。在新时代里，三万块钱之类的作用，可能才关键。",
              "simpEn": "I stayed in the hospital for three days. I had many dreams. But not one of them was about Man Mei. I knew who had taken Man Mei from me. It wasn't really that Hong Kong sissy with a few stinking coins and a few thugs. It was this rapidly changing new era. In the new era, poetry is useless. Dreams are useless. Even roses may be useless. In the new era, thirty thousand yuan—things like that—may be what matters.",
              "simpZh": "我在医院住了三天。做了很多梦，但没有一个是关于满妹。我知道是谁从我身边带走了她——不是那个有几个臭钱的香港娘娘腔，而是这个急剧变化的新时代。新时代里，诗歌没用，梦也没用，连玫瑰都没用。三万块钱之类的东西可能才关键。"

            {
              "en": "Yet I always felt that Man Mei loved me. Whenever my head ached, I thought that. We were about to be married. Losing her only made me think it more strongly. Money is money. Love is love. I had that intuition. I swear it on my former Shaanxi prodigy status: my premonition was right.",
              "zh": "但我总觉得，满妹妹应该是爱我的。我一头痛的时候，就那么想。我们就快结婚了。我失去了她反而更坚定地那么去想。钱是钱，爱情是爱情。我有这种直觉。我对大家以昔日陕西神童的名义担保，我这么预感是对的。",

              "simpZh": "但我总觉得满妹爱我。一头痛我就那么想。我们快结婚了。失去她反而让我更坚定地那么想。钱是钱，爱情是爱情。我有这种直觉。我以昔日陕西神童的名义担保，我的预感是对的。"
            },

      renderParagraphs(paragraphs);
      const quiz = currentChapter.quiz || [];
      renderQuiz(quiz);
    }

    function renderPagesMode() {
      document.getElementById('sectionTabs').innerHTML = '';
      const paragraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      const pageSize = 6;
      const totalPages = Math.ceil(paragraphs.length / pageSize);
      document.getElementById('sectionProgress').textContent = '📄 Page 1 of ' + totalPages + ' (automated content normalization layout bounds)';
      const enDiv = document.getElementById('enContent');
      const zhDiv = document.getElementById('zhContent');
      enDiv.innerHTML = ''; zhDiv.innerHTML = '';
      paragraphs.forEach((p, i) => {
        if (i > 0 && i % pageSize === 0) {
          const pageBreakEn = document.createElement('div');
          pageBreakEn.className = 'page-break';
          pageBreakEn.textContent = '📄 Page ' + (Math.floor(i/pageSize)+1);
          enDiv.appendChild(pageBreakEn);
          const pageBreakZh = document.createElement('div');
          pageBreakZh.className = 'page-break';
          pageBreakZh.textContent = '📄 Page ' + (Math.floor(i/pageSize)+1);
          zhDiv.appendChild(pageBreakZh);
        }
        const enP = document.createElement('p');
        enP.innerHTML = isSimplified ? (p.simpEn || '').replace(/<[^>]*>/g, '') : p.en;
        enDiv.appendChild(enP);
        const zhP = document.createElement('p');
        zhP.textContent = isSimplified ? p.simpZh : p.zh;
        zhDiv.appendChild(zhP);
      });
      const quiz = currentChapter.quiz || [];
      renderQuiz(quiz);
    }

    function renderSectionsMode() {
      const sections = currentChapter.sections;
      if (!sections || sections.length === 0) {
        renderFullMode();
        return;
      }
      const tabContainer = document.getElementById('sectionTabs');
      tabContainer.innerHTML = '';
      sections.forEach((sec, idx) => {
        const tab = document.createElement('button');
        tab.className = 'section-tab';
        if (idx === currentSection) tab.classList.add('active');
        tab.textContent = (idx+1) + '. ' + sec.heading;
        tab.setAttribute('role', 'tab');
        tab.setAttribute('aria-selected', idx === currentSection ? 'true' : 'false');
        tab.setAttribute('tabindex', idx === currentSection ? '0' : '-1');
        tab.addEventListener('click', () => {
          currentSection = idx;
          renderSectionsMode();
          saveFullProgress();
        });
        tabContainer.appendChild(tab);
      });
      const tabs = Array.from(tabContainer.querySelectorAll('.section-tab'));
      tabContainer.addEventListener('keydown', (e) => {
        const idx = tabs.indexOf(document.activeElement);
        if (idx === -1) return;
        if (e.key === 'ArrowRight' && idx < tabs.length-1) {
          e.preventDefault();
          tabs[idx+1].focus();
          tabs[idx+1].click();
        } else if (e.key === 'ArrowLeft' && idx > 0) {
          e.preventDefault();
          tabs[idx-1].focus();
          tabs[idx-1].click();
        }
      });

      document.getElementById('sectionProgress').textContent = 'Section ' + (currentSection+1) + ' of ' + sections.length;

      const sec = sections[currentSection];
      renderParagraphs(sec.paragraphs);
      renderQuiz(sec.quiz || []);
    }

    function renderParagraphs(paragraphs) {
      const enDiv = document.getElementById('enContent');
      const zhDiv = document.getElementById('zhContent');
      enDiv.innerHTML = '';
      zhDiv.innerHTML = '';
      paragraphs.forEach(p => {
        const enP = document.createElement('p');
        enP.innerHTML = isSimplified ? (p.simpEn || '').replace(/<[^>]*>/g, '') : p.en;
        enDiv.appendChild(enP);
        const zhP = document.createElement('p');
        zhP.textContent = isSimplified ? p.simpZh : p.zh;
        zhDiv.appendChild(zhP);
      });
    }

    function renderQuiz(quizArr) {
      const tfContainer = document.getElementById('tfQuestions');
      tfContainer.innerHTML = '';
      const quizToUse = (quizArr && quizArr.length) ? quizArr : placeholderQuiz;
      quizToUse.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'quiz-item-wrapper';
        div.innerHTML = `
          <div><strong>${i+1}.</strong> ${q.text} 
            <select class='tf-sel' style='width:auto; display:inline-block; margin-left:0.5rem; padding:0.2rem 0.5rem;'>
              <option value=''>--</option>
              <option value='true'>True</option>
              <option value='false'>False</option>
            </select>
          </div>
          <div class='rationale-container'></div>
        `;
        tfContainer.appendChild(div);
      });
      document.getElementById('tfFeedback').textContent = '';
    }

    document.getElementById('simplifyToggle').addEventListener('click', () => {
      isSimplified = !isSimplified;
      document.getElementById('simpActiveLabel').classList.toggle('active', isSimplified);
      if (currentChapter) renderWithMode();
      document.getElementById('simplifyToggle').textContent = isSimplified ? '📖 Switch back to Original Prose' : '📖 Switch to Simplified Prose';
      hidePopup();
    });

    const popup = document.getElementById('vocabPopup');
    function showPopup(trigger, vocabKey) {
      const def = vocabDefinitions[vocabKey];
      if (!def) return;
      document.getElementById('popupZh').textContent = def.zh;
      document.getElementById('popupExplain').textContent = '📘 ' + def.explain;
      document.getElementById('popupSimple').textContent = '💬 Simple Context: ' + def.simple;
      const rect = trigger.getBoundingClientRect();
      let top = rect.bottom + 8, left = rect.left;
      if (left + 320 > window.innerWidth) left = window.innerWidth - 330;
      if (top + 180 > window.innerHeight) top = rect.top - 180;
      popup.style.top = top + 'px'; popup.style.left = left + 'px';
      popup.classList.add('show'); currentVocabTrigger = trigger;
    }
    function hidePopup() { popup.classList.remove('show'); currentVocabTrigger = null; }
    document.addEventListener('click', function(e) {
      const trig = e.target.closest('.vocab-trigger');
      if (trig && trig !== currentVocabTrigger) {
        e.stopPropagation();
        showPopup(trig, trig.getAttribute('data-vocab'));
      } else if (trig === currentVocabTrigger) hidePopup();
      else if (!e.target.closest('#vocabPopup')) hidePopup();
    });
    document.getElementById('closePopup').addEventListener('click', (e) => { e.stopPropagation(); hidePopup(); });
    window.addEventListener('scroll', () => { if (currentVocabTrigger) hidePopup(); });

    document.getElementById('speakBtn').addEventListener('click', () => {
      if (!window.speechSynthesis) return alert('Local TTS execution context unavailable inside this environment environment framework.');
      speechSynthesis.cancel();
      const paragraphs = currentChapter.paragraphs || (currentChapter.sections ? currentChapter.sections.flatMap(s => s.paragraphs) : []);
      const text = paragraphs.map(p => p.en.replace(/<[^>]*>/g, '')).join(' ');
      const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; u.rate = 0.9;
      speechSynthesis.speak(u);
    });

    // IMPROVED: Quiz rationale feedback presentation runtime script engine integration.
    document.getElementById('checkTfBtn').addEventListener('click', () => {
      const quizArr = currentChapter.sections && readingMode==='sections' ? (currentChapter.sections[currentSection]?.quiz || []) : (currentChapter.quiz || []);
      const quizToUse = quizArr.length ? quizArr : placeholderQuiz;
      let correct = 0;
      
      const selectors = document.querySelectorAll('.tf-sel');
      selectors.forEach((sel, i) => {
        const val = sel.value;
        const currentItem = quizToUse[i];
        const wrapper = sel.closest('.quiz-item-wrapper');
        const ratBox = wrapper.querySelector('.rationale-container');
        
        if (val === '') {
          sel.style.border = '1px solid #ccc';
          ratBox.style.display = 'none';
          return;
        }

        const userTrue = (val === 'true');
        const correctChoice = (userTrue === currentItem.answer);

        ratBox.style.display = 'block';
        if (correctChoice) {
          sel.style.border = '2px solid green';
          correct++;
          ratBox.style.borderLeft = '4px solid green';
          ratBox.innerHTML = `<span style="color:green; font-weight:bold;">✓ Correct.</span> ${currentItem.rationale ? currentItem.rationale : ''}`;
        } else {
          sel.style.border = '2px solid red';
          ratBox.style.borderLeft = '4px solid red';
          ratBox.innerHTML = `<span style="color:red; font-weight:bold;">✗ Incorrect.</span> ${currentItem.rationale ? currentItem.rationale : ''}`;
        }
      });
      document.getElementById('tfFeedback').textContent = '📊 Processing Complete! Score: ' + correct + ' / ' + quizToUse.length;
    });

    function saveFullProgress() {
      const state = {
        chapterIndex: currentChapterIndex,
        sectionIndex: (readingMode === 'sections' && currentChapter.sections) ? currentSection : 0,
        readingMode: readingMode
      };
      localStorage.setItem(PROGRESS_KEY, JSON.stringify(state));
      updateProgressIndicator();
    }

    function updateProgressIndicator() {
      const saved = localStorage.getItem(PROGRESS_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          const ch = bookData.chapters[state.chapterIndex];
          if (ch) {
            let info = '📌 Bookmarked Position: Ch. ' + ch.id;
            if (ch.sections && state.sectionIndex) info += ' · ' + ch.sections[state.sectionIndex].heading;
            info += ' | ' + (state.chapterIndex+1) + '/' + bookData.chapters.length + ' modules';
            document.getElementById('progressBox').textContent = info;
          }
        } catch(e) {}
      }
    }

    function restoreProgress() {
      const saved = localStorage.getItem(PROGRESS_KEY);
      if (saved) {
        try {
          const state = JSON.parse(saved);
          const chIndex = state.chapterIndex;
          if (chIndex >= 0 && chIndex < bookData.chapters.length) {
            document.getElementById('chapterSelect').value = chIndex;
            readingMode = state.readingMode || 'sections';
            readingModeSelect.value = readingMode;
            loadChapter(chIndex);
            if (readingMode === 'sections' && bookData.chapters[chIndex].sections) {
              currentSection = state.sectionIndex || 0;
              renderSectionsMode();
            }
            return;
          }
        } catch(e) {}
      }
      loadChapter(0);
    }

    populateChapterSelector();
    restoreProgress();
    updateProgressIndicator();
  })();
</script>
</body>
</html>
