              "zh": "小学三年级的时候，我写的作文就是五年级同学们的范文。语文老师甚至要求他们写读了我的作文后的读后感。读完三年级，我就以全县升学考试前三名的成绩直接升入中学。学校板报上甚至这么写着，长征路上大步跑，实现四化学黄翔。",
              "simpEn": "In third grade, my essays were examples for fifth graders. The teacher even asked them to write about my essays. After third grade, I went straight to middle school and was third in the county exam. The school wrote: 'Run fast on the Long March; learn from Huang Xiang to build a modern country.'",
              "simpZh": "小学三年级，我写的文章是五年级的范文。老师甚至让他们写读后感。读完三年级，我直接跳级上中学，县里考了第三名。学校板报写着：'大步走长征路，学黄翔搞四个现代化。'"
            },
            {
              "en": "Before I turned sixteen, I scored in the top twenty of the Shaanxi college entrance exams and was swept into the <span class=\"vocab-trigger\" data-vocab=\"Special Class for Gifted Youth\">Special Class for Gifted Youth<\/span> at the University of Science and Technology. If a television crew hadn't kept filming my back during the physics exam, <span class=\"vocab-trigger\" data-vocab=\"rattling me\">rattling me<\/span> into a handful of foolish mistakes, and if my eye hadn't been badly injured not long before, I might have snatched some top honour in Shaanxi myself.",
              "zh": "我还没有年满十六岁，就以全陕西前二十名的高考成绩考入科大少年班。如果不是在我考物理的时候，电视台的记者对着我的背影一阵乱拍，让我出了几个昏招，再加上我不久前，眼睛受了严重的创伤，也许我也能弄个陕西的什么元当当。",
              "simpEn": "Before I turned sixteen, I got into the gifted youth class at the University of Science and Technology. If a TV crew hadn't filmed me during the physics test and made me nervous, and if my eye hadn't been hurt, maybe I would have been the top student in Shaanxi.",
              "simpZh": "十六岁前，我考进了科技大学少年班。要不是考物理时有电视台拍我，让我紧张出错，加上眼睛受伤，说不定我就是陕西第一名了。"
            },
            {
              "en": "Back then I was drawn to Chinese medicine, astrology, and any strain of mysticism life presented. In middle school, what stunned me and stirred my worship were Einstein's relativity and the ancient <em>Book of Songs<\/em>. I also loved taking other people's <span class=\"vocab-trigger\" data-vocab=\"pulse\">pulse<\/span>; it felt like I could hear the murmur of their hearts and <span class=\"vocab-trigger\" data-vocab=\"viscera\">viscera<\/span>. Always, it seemed, there was someone living deep inside us, walking to and fro through the blood—much as I now walk to and fro through this novel, which is <span class=\"vocab-trigger\" data-vocab=\"solemn as a mountain, smooth as silk\">solemn as a mountain, smooth as silk<\/span>.",
              "zh": "那时候的我喜欢中医、星相和生活中的任何的神秘主义。中学时候，让我最吃惊和崇拜的一度就是爱因斯坦的相对论和古代《诗经》。我还喜欢给别人号脉，因为那样我会觉得可以听见别人的心灵加内脏之声。那里面，总是似乎有人，在我们的身体深处活着，在血液里走来走去，类似我现在在这部如山也如绸的小说里走来走去。",
              "simpEn": "I was interested in Chinese medicine, astrology, and all mysterious things. I admired Einstein's relativity and the ancient Book of Songs. I liked feeling people's pulse, as if I could hear their heart and inner organs. It felt like someone was walking inside our blood, just as I walk through this novel that is like mountain and silk.",
              "simpZh": "我喜欢中医、占星和各种神秘的东西。我崇拜爱因斯坦的相对论和古老的《诗经》。我还喜欢给人把脉，好像能听见他们的心跳和内脏的声音。总感觉有个人在我们身体里走动，就像我现在在这部像山又像丝的小说里走动一样。"
            },
            {
              "en": "Last year I began living with a blonde Russian immigrant—the woman I once declared would be the last in my life. She has long hair the colour of <span class=\"vocab-trigger\" data-vocab=\"tarnished silver\">tarnished silver<\/span> and legs that go on forever. I used to tease her that she was Toronto's first pick for a table dancer, though her real job was selling clothes in a big supermarket. I loved her because between us, most of the time, only <span class=\"vocab-trigger\" data-vocab=\"body language\">body language<\/span> was needed. Body language is the first language of dreams: in dreams, we open our mouths but no sound comes out.",
              "zh": "去年，我和一个金发的俄国女移民开始同居。那个女人，曾经被称作我生命里最后的一个女人。她有一头接近银色的漂亮长发，还有一对长腿。总被我戏称是多伦多桌上舞第一人选。不过她在这里的真正工作，是在一家大超市卖服装。我喜欢她，因为大家之间，更多的只需要身体语言。身体语言其实是梦中的第一语言，在梦里，我们总是张开嘴，却什么也说不出。",
              "simpEn": "Last year I moved in with a blonde Russian woman. I said she would be my last woman. Her hair is almost silver, and she has long legs. I joked she should be a dancer, but she actually sells clothes in a supermarket. I loved her because we mostly used body language. Body language is the language of dreams: in dreams, we try to speak but no words come out.",
              "simpZh": "去年我和一个金发俄国女人同居。我说她会是我最后一个女人。她的头发接近银色，腿很长。我开玩笑说她该去跳舞，但其实她在超市卖衣服。我喜欢她，因为我们基本不用说话，只用身体语言。身体语言是梦的语言：梦里我们张嘴却说不出话。"
            },
            {
              "en": "I met her at the corner bar and called her Anna, after the heroine of that classic Russian novel. I loved Anna because, between a man and a woman, silence is the most beautiful state. I have always felt that speech is too <span class=\"vocab-trigger\" data-vocab=\"didactic\">didactic<\/span>; only in writing a novel can words be used without restraint.",
              "zh": "我是在街对角的酒吧里认识的她，我叫她安娜。因为我知道有一个同名的经典的俄国小说中女主人公人也叫这个名字。我爱安娜，是因为，我觉得男人和女人之间，不说话的状态最优美。我总觉得语言太说教，只能在写小说的时候才能被无限制使用。",
              "simpEn": "I met her at the bar across the street and named her Anna, after the heroine of a famous Russian novel. I loved her because silence between a man and a woman is the most beautiful. I think spoken words are too preachy; only in novels can you use words freely.",
              "simpZh": "我在街角酒吧认识她，叫她安娜，跟一本俄国小说里的女主角同名。我爱她，因为男女之间不说话最美。我觉得说话太爱教训人，只有写小说时才能随便用词。"
            },
            {
              "en": "Nine years of living in Toronto, with a single year back in China between—again and again I flew across the Pacific and the wide, empty wilderness of Canada, a <span class=\"vocab-trigger\" data-vocab=\"migratory bird\">migratory bird<\/span>. All that crossing has taught me to crave silence. My most unbearable moments are also my happiest; it is then that I wander through my conversations with you. On the very day I began to tell this story, Anna—this so-called last woman of my life—walked away. The truth is, when she was here, I felt even more alone. Women bring us not only joy, but a sharp, <span class=\"vocab-trigger\" data-vocab=\"abiding loneliness\">abiding loneliness<\/span>.",
              "zh": "九年的多伦多生活，期间又回归过中国一年，反反复复的几次飞行，穿越太平洋和加拿大辽阔的原野，候鸟一样的经历，如今更让我在生活中喜欢沉默不语。我最难受的时候，其实也就是最快乐的时候，那时候我就游走在和你们的对话中。在开始述说这个故事的这天，安娜，这个所谓我生命里最后一个女人，也离去了。其实，她在这里的时候，我才更加感觉孤独。女人，不仅仅给我们带来快乐，还有的就是孤独。",
              "simpEn": "I've lived in Toronto for nine years, with one year back in China. I've flown across the Pacific many times, like a bird migrating. All this travel has made me love silence. My hardest times are also my happiest, when I talk with you in my mind. On the day I started this story, Anna left me. When she was here, I felt even lonelier. Women bring joy, but also a deep loneliness.",
              "simpZh": "我在多伦多住了九年，中间回中国一年。像候鸟一样飞过太平洋好多次。飞来飞去让我更爱沉默。我最难受的时候也是最快乐的时候，那时我在想象里跟你们说话。我开始讲这个故事的那天，安娜走了。其实她在的时候，我更孤独。女人带来的不仅是快乐，还有深深的孤独。"
            },
            {
              "en": "In my youth, I liked to be called <span class=\"vocab-trigger\" data-vocab=\"Poet Huang Xiang\">Poet Huang Xiang<\/span>. I truly worshipped art and science then. Those years would perch on my shoulder like a bird, then vanish over the horizon like a comet. Here in Toronto, I also carry a legally meaningless English name, Michael. My foreign neighbours always call me <span class=\"vocab-trigger\" data-vocab=\"Fei Wu\">Fei Wu<\/span>—Flying Dance. That <span class=\"vocab-trigger\" data-vocab=\"androgynous\">androgynous<\/span> name is one I only use online. By Flying Dance I mean the way dreams soar like mountains, like silk.",
              "zh": "少年时代，我喜欢别人叫我诗人黄翔。因为那时候我真正崇拜过艺术和科学。那些年代总是像鸟一样偷偷地站在我肩头，然后又像彗星一样快速消失在地平线后。在多伦多，我也有个所谓的没法津意义的英语名字麦可。老外邻居们则永远叫我飞舞。飞舞这个不男不女的名字其实我也就在网上用用。我对飞舞的进一步解释就是梦境总是如山如绸般地飞舞。",
              "simpEn": "When I was young, I liked being called Poet Huang Xiang. I truly loved art and science. Those times were like a bird sitting on my shoulder, then disappearing like a comet. In Toronto I have an English name, Michael, but neighbours call me Fei Wu—Flying Dance. I use that name only online. It means dreams flying like mountains and silk.",
              "simpZh": "小时候我喜欢别人叫我诗人黄翔。我真心热爱艺术和科学。那些日子像小鸟停在肩头，又像彗星消失。在多伦多我有英文名迈克尔，但邻居叫我飞舞。这个不男不女的名字我只在网上用。意思是梦像山和丝一样飞舞。"
            },
            {
              "en": "What I love most here is the Toronto winter. I love thick, honest snow—it has weight, <span class=\"vocab-trigger\" data-vocab=\"integrity\">integrity<\/span>. When a heavy snowfall comes, I always drift back to my youth and China, or to art. I think of my Chinese life as my <span class=\"vocab-trigger\" data-vocab=\"upper body\">upper body<\/span>, and my life abroad as my <span class=\"vocab-trigger\" data-vocab=\"lower body\">lower body<\/span>. Sometimes memory blurs: all the women, all the friends, even the enemies of my life, appear at the same party in my mind, embracing, raising glasses to one another. At such times I murmur that my life is nothing but their <span class=\"vocab-trigger\" data-vocab=\"backdrop\">backdrop<\/span>, their background music. I am the music—this thought gives me a secret pleasure.",
              "zh": "在这里，我最喜欢多伦多的冬天。我喜欢厚实的大雪，给人的感觉很厚道。我总是在下大雪的时候，回忆我年轻时代和中国或者艺术。我以为我的中国生活是我的上半身，国外的是我的下半身。有时候，我会混淆记忆，在记忆里面，我人生中所有的女人和所有的朋友甚至敌人，会出现在同一个派对里相互拥抱相互祝酒。那时候，我会念叨，对于他们，我的人生，不过是他们的背景或者背景音乐。我是音乐，这想法让我偷乐。",
              "simpEn": "I love Toronto winters most. I like thick, honest snow—it feels solid and real. When it snows heavily, I think of my youth, China, and art. I see my Chinese life as my upper body, and my life abroad as my lower body. Sometimes my memories mix: all the women, friends, and enemies of my life come to a party in my mind, hugging and toasting. Then I whisper: my life is just the background, the music for them. I am the music—that thought makes me secretly happy.",
              "simpZh": "我最喜欢多伦多的冬天。我喜欢厚厚的大雪，感觉很实在。下大雪的时候，我就会想起年轻时代、中国和艺术。我觉得中国的生活是我的上半身，国外的生活是下半身。有时候记忆混在一起：所有女人、朋友甚至敌人，都在我脑海的派对上拥抱祝酒。那时我就念叨：我的人生不过是他们的背景，是背景音乐。我就是音乐——这想法让我偷偷地乐。"
            },
            {
              "en": "Yet this year has been a strangely warm winter; even now, Toronto has not seen a single proper snowfall. I keep thinking: let the snow come. When it finally falls, my story will reach its true <span class=\"vocab-trigger\" data-vocab=\"climax\">climax<\/span>.",
              "zh": "不过今年居然是一个罕见的暖冬，直到现在，多伦多，还没正经地下过一场大雪。我总是想，等雪来了，我的故事估计也就到了高潮了。",
              "simpEn": "But this year is a warm winter. Toronto still hasn't had a real snow. I keep thinking: when the snow comes, my story will reach its climax.",
              "simpZh": "但今年是个暖冬，多伦多还没正经下过一场大雪。我总想：等雪来了，我的故事就到高潮了。"
            }
          ],

        {
          "sectionId": 4,
          "heading": "The Grandfather's Secret",
          "paragraphs": [
            {
              "en": "Let me tell you about my grandfather. Officially, his <span class=\"vocab-trigger\" data-vocab=\"class status\">class status<\/span> was \"worker.\" In truth, he was a <span class=\"vocab-trigger\" data-vocab=\"fugitive Kuomintang officer\">fugitive Kuomintang officer<\/span>, living under an assumed name. He fled Hunan for Xi'an, Shaanxi—first settling in <span class=\"vocab-trigger\" data-vocab=\"Lintong\">Lintong<\/span>, the place now world-famous for the <span class=\"vocab-trigger\" data-vocab=\"terracotta warriors\">terracotta warriors<\/span> and the hot springs of <span class=\"vocab-trigger\" data-vocab=\"Imperial Consort Yang\">Imperial Consort Yang<\/span>. Later he moved into the city of Xi'an proper, and later still, after retiring, returned to Lintong. Back then, Lintong was only a county town, not yet part of Xi'an. I spent my childhood there; open the door and you faced <span class=\"vocab-trigger\" data-vocab=\"Mount Li\">Mount Li<\/span>, shaped exactly like a <span class=\"vocab-trigger\" data-vocab=\"crouching horse\">crouching horse<\/span>. The mountain is a <span class=\"vocab-trigger\" data-vocab=\"dormant volcano\">dormant volcano<\/span>, but I always half-believed it might erupt some night without warning.",
              "zh": "说说我的祖父吧。他的出身成分是工人。其实，他不过是一个隐名埋姓的逃亡国民党军官。他从湖南跑到陕西西安。先在临潼，就是那个以兵马俑和杨贵妃温泉闻名世界的地方。后来又去了西安。再后来退休了又回到临潼。那时候，临潼还只是一个县，不属于西安。我的童年时代，的确住在临潼，推门就可以看见形状如一匹窝着的骏马的骊山。这座山是死火山，但我总觉得也许哪年它会在半夜爆发。",
              "simpEn": "My grandfather was officially a worker, but really he was a hidden Nationalist army officer. He fled Hunan to Shaanxi, first to Lintong, famous for the terracotta soldiers and Yang Guifei's hot springs. Later he went to Xi'an, and after retiring came back to Lintong. As a child I lived in Lintong; outside my door was Mount Li, shaped like a crouching horse. It's an old volcano, but I always felt it might erupt one night.",
              "simpZh": "我祖父成分是工人，其实他是潜伏的国民党军官，从湖南逃到陕西。先到临潼，就是有兵马俑和杨贵妃温泉的地方。后来去了西安，退休后又回临潼。小时候我住在临潼，一开门就是骊山，像一匹卧着的马。它是死火山，但我总觉得它哪天半夜会爆发。"
            },
            {
              "en": "In ancient times, <span class=\"vocab-trigger\" data-vocab=\"Qin Qiong\">Qin Qiong<\/span>—the last of the thirteen heroes of the Sui and Tang dynasties—began his life of exile and rebellion at the foot of this very mountain. The mountain is also notorious for the <span class=\"vocab-trigger\" data-vocab=\"beacon fires that fooled the feudal lords\">beacon fires that fooled the feudal lords<\/span>, and for the <span class=\"vocab-trigger\" data-vocab=\"Chiang Kai-shek capture hall\">Chiang Kai-shek capture hall<\/span> from the <span class=\"vocab-trigger\" data-vocab=\"Xi'an Incident\">Xi'an Incident<\/span>. Looking back now, the idea of a king lighting the entire nation's military signal fires just to coax a smile from a woman—that strikes me as a profoundly artistic act. That emperor, at his core, must have been a brilliant <span class=\"vocab-trigger\" data-vocab=\"performance artist\">performance artist<\/span>.",
              "zh": "古时候，隋唐时代的英雄秦琼，十三条好汉里的最后一条，就是在这座山下开始了他的江湖逃亡和造反生涯。这座山还以烽火戏诸侯，和西安事变中的捉蒋厅而闻名。现在看来，一个君王，能那样用点燃全国军事信号烽火去取悦女人，一定是一件很艺术的事情。所以，那个皇帝，本质上一定是一名优秀的行为艺术家。",
              "simpEn": "Long ago, the hero Qin Qiong started his rebel life at this mountain. The mountain is also known for the story of lighting signal fires to fool the lords, and for the place where Chiang Kai-shek was captured during the Xi'an Incident. I think lighting all those fires just to please a woman was a very artistic thing. That emperor was really a performance artist.",
              "simpZh": "古时候，英雄秦琼在这座山下开始逃亡和造反。这座山还因为烽火戏诸侯和西安事变捉蒋介石而出名。现在想想，一个国王点燃所有军事信号火来逗女人笑，这太艺术了。那个皇帝其实是个行为艺术家。"
            },
            {
              "en": "It was only when my grandfather was very old—or perhaps after he died—that my father told me the truth. In his youth, my grandfather had served under the warlord <span class=\"vocab-trigger\" data-vocab=\"Feng Yuxiang\">Feng Yuxiang<\/span> and later became a colonel martial arts instructor in the Nationalist army. Passing himself off as a railway worker, he managed to survive several <span class=\"vocab-trigger\" data-vocab=\"political purges\">political purges<\/span>.",
              "zh": "等我的祖父很老的时候，或者是死以后，爸爸才告诉我真相。原来，祖父年轻时候，跟随过军阀冯玉祥，还做过国民党的上校武术教官。他以当铁路工人幸运地躲过了几次国内的清查运动。",
              "simpEn": "Only when my grandfather was very old or dead did my father tell me the truth. My grandfather had followed the warlord Feng Yuxiang and later was a martial arts instructor in the Nationalist army. He hid as a railway worker and survived several political clean-up campaigns.",
              "simpZh": "祖父很老了或者死后，爸爸才告诉我真相。祖父年轻时跟过军阀冯玉祥，后来是国民党的武术教官。他假装铁路工人，躲过了几次政治清查。"
            },
            {
              "en": "My sharpest memory is that his favourite book, all his life, was <em><span class=\"vocab-trigger\" data-vocab=\"The Three Heroes and Five Gallants\">The Three Heroes and Five Gallants<\/span><\/em>. He died in the later years of the <span class=\"vocab-trigger\" data-vocab=\"Cultural Revolution\">Cultural Revolution<\/span>, though I always remember it as happening the same year as Chairman Mao's death. That year, I was made to weep, publicly and loudly, many times over.",
              "zh": "我最清晰的记忆，是祖父一生最爱的书是《三侠五义》。他死在“文革”后期。但我总记得他似乎和伟大领袖毛泽东在同一年去世。那一年，我被要求要痛哭很多次。",
              "simpEn": "His favourite book was 'The Three Heroes and Five Gallants'. He died in the later part of the Cultural Revolution, but I remember it as the same year Mao died. That year, I was ordered to cry in public many times.",
              "simpZh": "他最喜欢的书是《三侠五义》。他死在文革后期，但我总记得和毛主席同一年死的。那年，我被要求当众大哭了很多次。"
            },
            {
              "en": "Later, in the days when we celebrated the smashing of the <span class=\"vocab-trigger\" data-vocab=\"Gang of Four\">Gang of Four<\/span>, I would see him in dreams—freshly dead, yet soaring back over the rooftops like the <span class=\"vocab-trigger\" data-vocab=\"Flying Rat Bai Yutang\">Flying Rat Bai Yutang<\/span>, just to visit his grandson. I also knew that his greatest dying wish was that his descendants never study martial arts. He believed it could no longer lead to any real future.",
              "zh": "在我们欢庆粉碎“四人帮”的日子里，我总在梦里看见刚刚死去不久的祖父像飞天鼠白玉堂一样飞檐走壁般地回来看望他的孙子。我还知道，他最大的一个遗愿就是他的后代绝不能练武。因为他觉得练武已经很难在现代社会里有大出息。",
              "simpEn": "When we celebrated smashing the Gang of Four, I dreamed of my recently dead grandfather flying over rooftops like the hero Flying Rat Bai Yutang, coming to see me. He also wished that none of his descendants would study martial arts; he thought it was useless in modern times.",
              "simpZh": "我们庆祝粉碎四人帮时，我梦见刚去世的祖父像飞天鼠白玉堂一样飞檐走壁来看我。他还遗愿后代不要练武，觉得在现代社会没出息。"

            {

              "zh": "在西安铁一中时代，我和戴戴和老水常是班里的前五名。当然还有以后同是科技大学校友的女生吴柔，吴柔则老考第一名。后来，她成为当年的陕西高考状元，成了铁一中永远的骄傲。",
              "simpEn": "In middle school, Dai Dai, Lao Shui, and I were usually in the top five. Wu Rou was always first. Later she became Shaanxi's top college exam scorer, the school's eternal pride.",
              "simpZh": "铁一中时，我、戴戴和老水一般是班里前五。吴柔老考第一。后来她成了陕西高考状元，是铁一中永远的骄傲。"
            },
            {
              "en": "I still remember how our homeroom teacher, Teacher Zhao, devoted herself above all to posting the class rankings after every end-of-term exam and summoning the parents. Grades became the sole measure of whether our future lives would succeed or fail.",
              "zh": "还记得，那时候，班主任赵老师最积极做的事情，就是在期末考试后张贴班级的名次排列和开家长会，成绩成了我们未来人生能否成功的唯一评价标准。",
              "simpEn": "I remember our head teacher, Teacher Zhao, was most eager to post class rankings after exams and hold parent meetings. Grades were the only way to measure if our future lives would succeed.",
              "simpZh": "我记得班主任赵老师最积极的事就是考完试贴排名和开家长会。成绩成了判断我们未来能不能成功的唯一标准。"
            },
            {
              "en": "In truth, even then my compositions were already outstanding—and out of line. Writing on a topic like \"The Happiest Day,\" I would slip in references to secret crushes, sexual awakening, or the intimate pleasures of reading the bedroom scenes in <em><span class=\"vocab-trigger\" data-vocab=\"Dream of the Red Chamber\">Dream of the Red Chamber<\/span><\/em>. My Chinese teacher never sensed in me the potential to one day write a long novel of dreams <span class=\"vocab-trigger\" data-vocab=\"solemn as mountains, smooth as silk\">solemn as mountains, smooth as silk<\/span>. He simply believed my essays were either <span class=\"vocab-trigger\" data-vocab=\"plagiarised\">plagiarised<\/span> or the product of a waking fantasy. <em>Write like this on the college entrance exam,<\/em> he warned, <em>and you'll score zero. Your life will be finished.<\/em>",
              "zh": "其实那时候，我的作文就已经写得很出色也很出格。我已经会在写《最快乐的一天》这样一个题目的作文里，提到暗恋、发情或者看《红楼梦》里面的性描写的心得体会。语文老师那时候则根本没感觉出我在未来有写作如山又如绸的梦境这样的长篇小说的潜力。他总觉得我的作文不是抄来的就是在发白日梦，高考时候这么写肯定得零分。我的人生也肯定完蛋。",
              "simpEn": "Even then my essays were excellent but unusual. In a composition called 'The Happiest Day,' I wrote about secret crushes, sexual feelings, and the sex scenes in 'Dream of the Red Chamber.' My Chinese teacher didn't see my talent for writing a dream-like novel. He thought I copied my essays or just daydreamed. He said if I wrote like that on the college exam, I'd get zero and my life would be over.",
              "simpZh": "其实那时我作文就写得很出色，也很出格。写《最快乐的一天》时，我会提到暗恋、发情、看《红楼梦》里性描写的感觉。语文老师根本看不出我有写这种如梦小说的潜力。他总觉得我作文不是抄的就是白日做梦，高考这么写肯定零分，我的人生就完蛋了。"
            },
            {
              "en": "Homeroom Teacher Zhao was a divorced, still alluring middle-aged beauty. And her daughter, Han Feng—she was the girl across the alley, the heroine of my rooftop spying. Strictly speaking, in terms of looks Han Feng might have ranked somewhere between fifth and tenth among the girls in our class; she had perhaps inherited more of her father's features. Yet perhaps because I was always studying the silhouette on her curtain, I harboured a peculiar, almost ancient feeling toward her. A feeling that was at once very distant and very near.",
              "zh": "班主任赵老师是一个风韵犹存的离婚的中年美女。但她的女儿寒风也就是我对面楼上老被我偷窥的女主角。就姿色严格来说，寒风最多也在我们班上的女生里排个前五以外前十以内，可能她遗传了更多她爸爸的外表。也许因为我总是偷看她的窗上剪影，所以我心里总是对她抱以一种极其特别或者说古的感情。那种感觉，说远很远，说近很近。",
              "simpEn": "Teacher Zhao was a divorced but still attractive middle-aged woman. Her daughter, Han Feng, was the girl I spied on across the alley. Honestly, Han Feng's looks were maybe top five to ten in our class; she probably looked more like her father. But because I always watched her shadow through the curtain, I felt something strange and old for her—a feeling both far away and very close.",
              "simpZh": "班主任赵老师是个离了婚但还有风韵的中年美女。她女儿寒风就是我对面楼上老偷看的女孩。说实话，寒风的长相在班里大概排五到十名，可能更像她爸。但因为我老偷看她的窗帘影子，我对她有种又古又特别的感情，说远很远，说近很近。"
            },
            {
              "en": "In daily life, when Han Feng wasn't studying earnestly, her favourite pastime was gazing at the boys with a kind of <span class=\"vocab-trigger\" data-vocab=\"mesmerised hunger\">mesmerised hunger<\/span>. She would stare, eyes fixed and unblinking, as though she meant to draw you into her pupils. She once stared at me that way too. Looking back now, I'd say she was perhaps a little boy-crazy, or what you might call adolescent bewilderment. Dai Dai even gave her an elegant nickname: \"The Gazing Woman.\" She retaliated by calling him \"<span class=\"vocab-trigger\" data-vocab=\"Eagle Beak\">Eagle Beak<\/span>.\" Though Dai Dai did have a severe, hooked nose, he was really the warmest, gentlest boy.",
              "zh": "生活中，寒风在不认真学习的时候，最喜欢做的事情就是色迷迷地看班上的男生们。她总是盯着看，目不转睛的样子，好像要把你吸进她的眼睛。她也那么盯过我。现在分析，她那样做也许是有点小花痴，或者称为青春期的迷惑。因此，戴戴还给她起了一个文雅的外号，叫“凝视的女人”。而她回敬了戴戴一个外号，是“鹰钩鼻”。戴戴虽然长着严酷的鹰钩鼻，其实却是一个很温暖很温柔的孩子。",
              "simpEn": "When Han Feng wasn't studying, she loved to stare at the boys with a hungry look. She would gaze without blinking, as if pulling you into her eyes. She stared at me once too. Now I think she was just boy-crazy, or confused by puberty. Dai Dai nicknamed her 'The Gazing Woman.' She called him 'Eagle Beak' because of his big nose, but he was actually the gentlest boy.",
              "simpZh": "寒风不认真学习时，就喜欢色迷迷地看男生。她盯着人看不眨眼，好像要把你吸进去。她也那样盯过我。现在想，她那时可能有点小花痴，或者青春期迷茫。戴戴给她起外号叫“凝视的女人”。她回叫戴戴“鹰钩鼻”。戴戴虽然长着鹰钩鼻，其实是个很温柔的孩子。"
            },
            {
              "en": "One winter night, Dai Dai, Lao Shui, and I squeezed into a single bed in the student dormitory. I was skinny enough to make it bearable, but still none of us wanted to be the middle layer of the \"<span class=\"vocab-trigger\" data-vocab=\"meat sandwich\">meat sandwich<\/span>\"—the concept of homosexuality not yet being in circulation, the brotherly press of bodies still felt innocent and good. I asked Dai Dai which girl in the class he liked. To my surprise, without hesitation he named Han Feng. It seemed being repeatedly gazed at by a girl did have its effect. Then we asked Lao Shui to name his idol. He flatly refused. So Dai Dai and I pelted him with winter vegetables—hard, frozen white radishes—driving him out into the bitter cold.",
              "zh": "有一天晚上，我和戴戴和老水挤在学生宿舍的一张床上过冬。幸好我瘦小些，不过三个人还是没人愿意主动睡在中间，当“肉夹馍”的中间一层。那时候还不流行同性恋者概念，所以做兄弟挤着睡的感觉很好。我问戴戴他喜欢班上哪个女生，没想到他脱口而出居然报的是寒风。看来，被女生反复凝视还是有效果的。然后我们问老水他的偶像。老水怎么也不肯说，最后被我和戴戴用过冬菜白萝卜一顿轰炸，打到寒冷的室外。",
              "simpEn": "One winter night, the three of us squeezed into one bed in the dorm. I was skinny, but still no one wanted to sleep in the middle like a 'meat sandwich.' Being gay wasn't a common idea then, so brotherly closeness felt fine. I asked Dai Dai which girl he liked—he immediately said Han Feng. So being stared at by a girl really worked. Then we asked Lao Shui. He refused to answer, so we threw frozen radishes at him and pushed him out into the freezing cold.",
              "simpZh": "一个冬天的晚上，我们三个挤一张床。我比较瘦，但还是没人愿睡中间当“肉夹馍”。那时还不讲同性恋，挤在一起睡感觉很兄弟。我问戴戴喜欢班里哪个女生，他张口就说寒风。看来被女生反复凝视是有效果的。然后我们问老水，他死不肯说，我和戴戴就用冻萝卜砸他，把他赶到冰冷的屋外。"
            },
            {
              "en": "Standing outside in nothing but shorts and a singlet, frozen to the marrow of his existence, Lao Shui was finally forced to confess. He, too, liked—loved, even—the very same \"Gazing Woman.\" The moment he said it, I felt a hot flush of shame. Because night after night, with far from honourable intentions, I had been spying on my best friends' beloved. And I myself—I, too, had been gazed at by Han Feng.",
              "zh": "老水短裤背心，人 生彻寒，终于在门外不得不承认，他也喜欢或者说爱上的是那个“凝视”。他报出“凝视”的时候，我觉得很难堪。因为，我总是在夜晚，不怀好意去偷窥好友们的心上人。就我自己，也被寒风凝视过。",
              "simpEn": "Lao Shui, wearing only shorts and a shirt, freezing to the bone, finally admitted he also loved the 'Gazing Woman.' When he said that, I felt deeply ashamed. Because every night, with bad intentions, I had been secretly watching the girl my best friends loved. And Han Feng had stared at me too.",
              "simpZh": "老水穿着短裤背心，冻得要死，终于在门外承认他也喜欢那个“凝视”。他说出来时，我觉得很难堪。因为我每天晚上都不怀好意地偷看好友们的心上人。而且，我自己也被寒风凝视过。"
            }
          ],

        {
          "sectionId": 8,
          "heading": "Family Legacies and a Friend's Revenge",
          "paragraphs": [
            {
              "en": "Dai Dai was born into a military family. His father served as a regimental political commissar in a garrison unit stationed near Lintong; his mother was a housewife. But during the most feverish years of the Cultural Revolution, it was said, she had been a university lecturer in Xi'an, famed for her skill in debate. She could speak torrents for ten hours straight and could recite more of Chairman Mao's quotations—and longer passages—than anyone else in the city. She became one of the \"Three Titans\" of a <span class=\"vocab-trigger\" data-vocab=\"rebel faction\">rebel faction<\/span>. Clearly, Dai Dai's own sharp memory and eloquence came straight from her.",
              "zh": "戴戴出生于一个军人家庭。父亲在临潼附近的驻军某某军做一个团政委。母亲是一个家庭妇女。不过“文革”最火热时期，据说他母亲那时候在西安做大学老师，擅长辩论。戴戴妈妈那时候，常常能口若悬河十个小时。能背诵毛主席的语录也是全西安最多最长。所以她是一个“造反派”的三巨头之一。看来，戴戴记忆好口才好就是由她遗传。",
              "simpEn": "Dai Dai's father was an army political commissar near Lintong; his mother was a housewife. But during the Cultural Revolution, she had been a university teacher famous for debating. She could speak for ten hours and recite more of Mao's quotations than anyone in Xi'an. She became a leader in a rebel group. Dai Dai got his memory and speaking skills from her.",
              "simpZh": "戴戴的爸爸是临潼附近部队的政委，妈妈是家庭妇女。但文革最火热时，她妈妈是西安大学老师，很会辩论，能一口气说十个小时，背毛主席语录全西安最多最长。她是造反派三大头头之一。戴戴的好记性和口才就是从她那儿来的。"
            },
            {
              "en": "One high-winded, starry night, Dai Dai's father went to fetch her home, a pistol on his belt. He made her withdraw, decisively, from the stage of revolutionary history. By then the rebel mission was nearing its end; many who had backed the wrong side were already bound for prison.",
              "zh": "戴戴父亲，在一个风高星夜，带枪去押解了她回家。让她坚决地退出了革命的历史舞台。那时候“造反派”的使命即将结束，不少人因为站错方向而进了监狱。",
              "simpEn": "One windy, starry night, Dai Dai's father came with a gun to take her home and forced her to quit the revolution. By then the rebel mission was ending; many who chose the wrong side went to prison.",
              "simpZh": "一个风大星多的夜晚，戴戴爸爸带枪把她押回家，让她退出革命舞台。那时候造反派的使命快结束了，很多人因为站错队进了监狱。"
            },
            {
              "en": "From that point on, Dai Dai's mother buried her ambitions and became a full-time housewife. All the hope she had once carried for her own life she poured instead into Dai Dai, who from a young age had shown an unnerving intelligence and a gift for writing.",
              "zh": "从此戴戴的妈妈掩埋雄心，做起了全职家庭妇女。所以，她把人生所有的希望都寄托在了从小就聪明过人，也写得一手好作文的戴戴身上。",
              "simpEn": "After that, Dai Dai's mother hid her dreams and became a housewife. She put all her hopes into Dai Dai, who had been very smart and a good writer since childhood.",
              "simpZh": "从那以后，戴戴的妈妈埋掉雄心，当全职家庭妇女。她把所有希望都寄托在从小聪明、作文写得好的戴戴身上。"
            },
            {
              "en": "Dai Dai's father had fought in the Korean War, initially as a company commander in a reconnaissance unit. On one mission he lay in ambush in the snow and lost three toes to frostbite. After he recovered, he was reassigned to propaganda work, where he excelled at composing <em>Shandong clapper ballads<\/em> and other morale-boosting literary pieces. His main task, though, was to discover and write up heroes from the volunteer forces. Legend has it that one of those heroes—whose story later appeared in middle-school textbooks nationwide—was first pulled from the mass of the fallen by Dai Dai's father and given his earliest public recognition.",
              "zh": "戴戴父亲参加过抗美援朝，一开始是一侦察连的连长。一次去执行任务，他埋伏在雪地里，被冻掉了三个脚指头。伤愈后改做文职宣传工作，最擅长发表山东快板之类鼓舞士气的军事文学作品。当然，他的主要工作是发掘和描写志愿军中的英雄人物。传说中有一个上了中学语文课本的英雄最早就是戴戴父亲从广大牺牲者中发现的，并做最早报道的。",
              "simpEn": "Dai Dai's father fought in the Korean War as a reconnaissance company commander. Once he hid in the snow and lost three toes to frostbite. After recovering, he did propaganda work, writing cheerful songs and stories about heroes. His main job was to find and write about volunteer army heroes. One hero in school textbooks was supposedly first discovered by him.",
              "simpZh": "戴戴的爸爸参加过抗美援朝，是侦察连长。有一次在雪地里埋伏冻掉三个脚趾。伤好后做宣传工作，擅长写山东快板鼓舞士气。他主要工作是发掘志愿军英雄。据说课本里有个英雄就是他最早发现并报道的。"
            },
            {
              "en": "Having grappled in the flesh with American imperialism, however, left him with feelings toward the United States that were immensely complicated. On the day Sino-American diplomatic relations were formally established, he drank himself into a stupor and wept, happily.",
              "zh": "不过，直接和美帝国主义肉身搏斗过的结果是，戴戴父亲对美国的感情，变得非常非常复杂。中美建交那天，他喝得酩酊大醉，还幸福地流泪。",
              "simpEn": "But fighting against Americans made his feelings about the US very complex. On the day China and the US officially made peace, he got drunk and cried happy tears.",
              "simpZh": "但是，跟美国兵肉搏过之后，戴戴爸爸对美国感情非常复杂。中美建交那天，他喝得大醉，幸福地流眼泪。"
            },
            {
              "en": "His emotion, put simply, was a mixture of awe and hatred. Years later, when Dai Dai went to study in America, no one supported him more fiercely than his father. He reasoned that American imperialism was, on the one hand, a paper tiger—Dai Dai would certainly be able to compete there. On the other hand, it represented the absolute pinnacle of an advanced nation. Perhaps he could never forget the advanced weaponry, the aircraft, the amphibious landing craft the Americans had brought to Korea. Later, after he transferred to civilian work in Xi'an as the head of personnel at a state-owned enterprise, his company's products were driven from the market by a Sino-American joint venture. He was laid off with honour just as Dai Dai finished his master's at Stanford. Days after losing his job, he was on a plane bound for America to attend Dai Dai's graduation. What passed through that old volunteer soldier's heart as his plane crossed into American airspace—pride, shame, a tangle of both—I can only imagine.",
              "zh": "戴戴父亲对美国的感情，简单的解释就是一种又敬又恨。多年后，戴戴留学美国，最支持的就是他爸爸。因为他觉得美帝国主义一方面是纸老虎，戴戴去了美国绝对有竞争能力。另一方面，又是先进国家的绝对代表。也许，他永远忘不了朝鲜战争中，美国人先进的武器，飞机和两栖登陆舰吧。等后来，他转业去了西安，做一家国有企业的人事处处长。当他们公司的产品被一家中美合资公司的产品彻底打败后，戴戴父亲光荣下岗，戴戴正好在斯坦福大学读完硕士。下岗后几天，他就坐在了去美国的飞机上，去参加戴戴的毕业典礼。云海上，不知道，这位老志愿军战士，在飞进美国的时刻，应该是一种怎样的光荣与惭愧的心情。",
              "simpEn": "Simply put, he both admired and hated America. Years later, when Dai Dai went to study in the US, his father was his biggest supporter. He thought America was a paper tiger but also the most advanced country. He never forgot American weapons in Korea. After he switched to a civilian job in Xi'an, his company lost to a US-China joint venture. He was laid off just as Dai Dai finished a master's at Stanford. Days later, he was flying to America for Dai Dai's graduation. I can only guess what he felt flying into the US—pride and shame mixed together.",
              "simpZh": "简单说，他对美国又敬又恨。多年后戴戴去美国留学，他爸爸最支持。他觉得美帝是纸老虎，戴戴去了能竞争；同时美国又是最先进国家。他忘不了朝鲜战场上美国的武器。后来他转业到西安国企，公司产品被中美合资打败，他光荣下岗。那时戴戴刚好在斯坦福硕士毕业。下岗没几天他就飞美国参加毕业典礼。飞进美国时，这位老志愿军心里是什么滋味——光荣加惭愧——我只能想象。"
            },
            {
              "en": "Lao Shui's father was a policeman in Xi'an, but at first the family home was also in Lintong; he came back once a week. Later, like my own family, they moved fully to the city. Now Lintong is just a district of Xi'an, twenty minutes on the freeway—much like my drive from Toronto to <span class=\"vocab-trigger\" data-vocab=\"Mississauga\">Mississauga<\/span>.",
              "zh": "老水的爸爸在西安当警察。但他的家一开始也安在临潼，他爸爸每周回来一次。后来和我家一样，都全搬去了西安。现在，临潼只是西安的一个区，高速公路上，几十分钟就到，类似我从多伦多开车去密西沙加。",
              "simpEn": "Lao Shui's father was a policeman in Xi'an. At first the family lived in Lintong and he came back weekly. Later they moved to Xi'an like my family. Now Lintong is just a district, a short drive away—like me driving from Toronto to Mississauga.",
              "simpZh": "老水的爸爸是西安警察，家原来在临潼，他每周回来一次。后来跟我家一样搬去西安。现在临潼只是西安一个区，高速开车二十分钟就到，就像我从多伦多开车去密西沙加。"
            },
            {
              "en": "The first time I met Lao Shui's father was during a Spring Festival after we had moved to Xi'an. He was playing mahjong with a few friends. I saw a fair pile of money on the table and thought to myself: a cop gambling—probably only the army would dare arrest him.",
              "zh": "我头次见到老水的爸爸是在我家搬去西安后的一个春节。那时候他正和几个朋友在打麻将。我看见桌上堆了不少钱，心想，警察赌博，估计是只有军队敢来抓了。",
              "simpEn": "I first met Lao Shui's father during a Spring Festival. He was playing mahjong with friends. I saw a lot of money on the table and thought: a policeman gambling—only the army would dare to arrest him.",
              "simpZh": "我第一次见老水爸爸是在西安的春节。他正和几个朋友打麻将。桌上堆了很多钱，我想：警察赌博，可能只有军队敢抓了。"
            },
            {
              "en": "Lao Shui was also the first classmate of mine with decent grades whom I ever saw smoking. It was our last year of middle school; he would stand in the lavatory blowing smoke rings and raging against the Chinese education system. I never imagined then that one day he would become a doctoral supervisor at Peking University—a guardian and beneficiary of the very system he had attacked in his youth.",
              "zh": "老水，还是我看见的最早抽烟的中学学习成绩还算优秀的同学。那还是我们初三的时候，他一边在厕所里吞云吐雾，一边抨击中国的教育体制。那时候真没想到，现在，他已经是北大博导，成为他少年时代抨击的东西的维护者和受益人。",

          "sectionId": 9,
          "heading": "Snatching Caps on Mount Li",
          "paragraphs": [
            {
              "en": "My youth was like the morning breeze of my entire life. I still miss it, quietly, secretly, because the boy I was then was truly unspoiled—not a trace of the money-world's stain on him. We were short of food and clothes; a brand-new <em><span class=\"vocab-trigger\" data-vocab=\"dacron\">dacron<\/span><\/em> army tunic was considered an honour to wear. Yet I miss that simplicity, those plain yellow army uniforms and blue work smocks of a more innocent time.",
              "zh": "少年时代类似我一生的清晨微风。我总是偷偷怀念那个时代。因为我觉得那时候的我，真的很单纯，还没有被金钱世界污染的任何痕迹。虽然缺衣少粮，能穿件崭新的的卡军装都是光荣，但我怀念它，怀念那些黄军装，蓝大褂的朴素岁月。",
              "simpEn": "My youth was like the morning breeze of my life. I miss it secretly because I was so pure then, not yet stained by money. We lacked food and clothes; a new polyester army jacket was an honour. I miss those simple days of yellow army uniforms and blue work coats.",
              "simpZh": "我的少年时代像一生的清晨微风。我偷偷怀念它，因为那时我真的很单纯，没被金钱世界污染。虽然缺衣少食，穿件新的的确良军装就很光荣。我怀念那些穿黄军装、蓝大褂的朴素日子。"

              "zh": "由于戴戴出身于军人家庭，所以他总能穿一些让大家羡慕的军装，还能戴军帽上学，让我和老水很嫉妒。有段时间，他总是说，也要给我和老水弄两顶新军帽，却一直不能兑现诺言。",
              "simpEn": "Dai Dai's military family meant he always had nice army clothes and caps, making us jealous. He kept promising to get caps for us but never did.",
              "simpZh": "戴戴是军人家庭，总有让人羡慕的军装和军帽，让我和老水很嫉妒。他老说要给我们弄两顶新军帽，但一直没有兑现。"
            },
            {
              "en": "So Lao Shui decided to take me up Mount Li to snatch some. This became, aside from the incident where Dai Dai, Lao Shui, and I stole pomegranates and were chased by an old Shaanxi farmer waving a fish spear—another early brush with \"<span class=\"vocab-trigger\" data-vocab=\"crime\">crime<\/span>.\" That day, Lao Shui's older brother led the expedition. He carried a <span class=\"vocab-trigger\" data-vocab=\"three-section chain whip\">three-section chain whip<\/span> and had secretly taken a pair of his policeman father's <span class=\"vocab-trigger\" data-vocab=\"handcuffs\">handcuffs<\/span>. We prowled the mountain for half the day and finally got two caps: one new, one old. The old one we pulled straight off the head of a girl student who had come from Xi'an to hike.",
              "zh": "结果，老水，决定带我去骊山去抢军帽。这是我早期人生中，除了和戴戴老水一起去石榴园偷石榴被陕西老农举着鱼叉在身后追杀外的另一次“犯罪”行。那天，带头的是老水的哥哥。他身上还带了根三节鞭，并偷了副他的警察爸爸用的手铐。我们在山上转了半天。最后抢到两顶，一新一旧，旧的那顶还是从西安来爬山的一女学生头上摘的。",
              "simpEn": "So Lao Shui took me to Mount Li to steal caps. Besides stealing pomegranates and being chased by a farmer with a spear, this was another 'crime.' His older brother led us, carrying a chain whip and his father's handcuffs. We wandered half a day and finally got two caps—one new, one old, taken from a girl student from Xi'an.",
              "simpZh": "于是老水带我去骊山抢军帽。除了偷石榴被老农拿鱼叉追，这是我早期另一次“犯罪”。他哥带头，带着三节鞭和他警察爸爸的手铐。我们在山上转了半天，最后抢到两顶帽子，一顶新一顶旧，旧的那顶是从西安来的女学生头上摘的。"
            },
            {
              "en": "Halfway up the mountain we also spotted a pair of lovers, half-naked, wrapped around each other behind a pine tree. I was so nervous that I barely saw the scene clearly. Lao Shui claimed he only saw them kissing. But his brother insisted he had seen them <em>making love<\/em>—one person jabbing at the other with something. That was the first time in my life I heard the words \"making love.\" In reality, Lao Shui's brother probably used a cruder term, something less academic. Later, back at Lintong Railway Middle School, he told everyone he met that he had caught city youth from Xi'an having sex on Mount Li and had scared them apart by throwing stones. The funny part, he added, was that they were stuck together and couldn't pull free! Here I have to admire the boy's imagination. Had I let him write this dream-novel of mine—solemn as mountains, smooth as silk—the details might well have been more vivid than my own.",
              "zh": "我们还在半山腰看见了一对情侣半裸着搂抱着躲在一棵松树后。记忆中，当时我太紧张了似乎根本就没看清那香艳的场面。老水说也只看见了他们在接吻。而老水的哥哥非说是他看见了他们是在做爱，一个人用东西捅另一个人。这是我人生中第一次听到做爱这字眼。当时老水哥哥的具体用词可能还没这么学术。估计是用的另一个更糙的用词。再后来，老水哥哥回到临潼铁中，逢人就说看见了西安来的城市青年在骊山上做爱，被他用扔石头惊散。可笑的是，他们俩粘在一起分不开了！在这里，我不得不佩服老水哥哥的想象力。也许，让他代替我来写这个如山又如绸的梦境，在细节上，一定会比我出彩。",
              "simpEn": "On the mountain we also saw a half-naked couple hugging behind a pine. I was too nervous to see clearly. Lao Shui said they were just kissing. But his brother said they were 'doing it'—one person poking the other. That was the first time I heard the phrase 'making love.' Later, his brother told everyone at school he'd caught city kids having sex and scared them with stones, and they were stuck together and couldn't separate! I admire his imagination. If he wrote this dream-novel, his details would be more colourful than mine.",
              "simpZh": "半山腰我们还看见一对半裸的情侣抱在松树后。我太紧张没看清。老水说他们只是在接吻。但他哥非说他们在“做爱”，一个人用东西捅另一个人。那是我第一次听到“做爱”这个词。后来他哥回学校见人就说抓到西安青年在骊山做爱，扔石头把他们吓到分不开。我真佩服他的想象力。要是让他写这本如山又如绸的梦小说，细节肯定比我精彩。"
            },
            {
              "en": "When we came down the mountain with the snatched caps, we ran into Dai Dai, holding up two brand-new army caps of his own. The old farmer and his fish spear during the pomegranate incident had left a deep impression on him; he felt he had to stop Lao Shui and me from going through with it. Those were years of harsh crackdowns, too. A few young hooligans, so the stories went, were executed by firing squad for nothing more than stealing a dozen yuan and harassing a girl on the street.",
              "zh": "抢军帽下山的时候，我们遇见了举着两顶新军帽的戴戴。他被那次偷石榴中的陕西老农的鱼叉吓怕了，觉得应该坚决阻 止我和老水的行为。那年头，还严打过好几次。有几个坏青年，据说仅仅因为抢十几块钱，拦路对女孩子耍流氓，就被枪毙了。",
              "simpEn": "Coming down, we met Dai Dai holding two new caps. The farmer with the fish spear had scared him; he wanted to stop us from snatching caps. Those were years of harsh punishment. Some young thugs were executed just for stealing a bit of money and bothering a girl.",
              "simpZh": "下山时，我们碰到戴戴，他举着两顶新军帽。他被偷石榴时那个老农的鱼叉吓坏了，想阻止我们。那几年正严打，有几个小青年据说只因为抢十几块钱、调戏女孩就被枪毙了。"

        {
          "sectionId": 10,
          "heading": "A Love Letter and Classroom Fury",
          "paragraphs": [
            {
              "en": "Studying in Xi'an, my brain began to produce strange and nameless things—states hovering between dream and waking, much like the one I inhabit now. Perhaps those were the earliest inklings of the dreamscape. The <span class=\"vocab-trigger\" data-vocab=\"college entrance exam\">college entrance exam<\/span> loomed like a mountain, but it never truly weighed on me. I felt that getting into a top university would be as simple as going to a street stall for <span class=\"vocab-trigger\" data-vocab=\"grilled lamb skewers and rou jia mo\">grilled lamb skewers and <em>rou jia mo<\/em><\/span>.",
              "zh": "在西安读中学，让我的感觉我的大脑会开始出现莫名其妙的东西，类似目前这种似梦非梦的境界。也许那就是初级梦境。高考是一座人生大山。但其实对我没多大压力。我觉得我去上名牌大学就类似去街边吃烤羊肉串吃肉夹馍那么简单。",
              "simpEn": "Studying in Xi'an, my mind started making strange dream-like things. Maybe those were early dreams. The college exam was a big mountain, but I didn't feel much pressure. I thought getting into a famous university was as easy as eating lamb skewers and meat buns on the street.",
              "simpZh": "在西安读书时，我脑子里开始出现莫名其妙的东西，像现在这种半梦半醒的感觉。也许那就是最初的梦境。高考是一座大山，但对我没多大压力。我觉得上名牌大学就像去路边吃烤肉串和肉夹馍一样简单。"
            },
            {
              "en": "A few years ago, one month, my old classmates gathered at Xi'an Railway No. 1 Middle School to mark the twentieth anniversary of our graduation. They met in the very classroom we had used in our final year. I heard that, aside from those who had moved away or gone abroad and couldn't return, only Han Feng, among the locals, did not come. No one knew where she was. The reunion was hosted by her mother, our former homeroom teacher, but even she claimed not to know her daughter's whereabouts. Or perhaps she simply wouldn't say. Some wounds last a lifetime; some are <span class=\"vocab-trigger\" data-vocab=\"fatal\">fatal<\/span>.",
              "zh": "前几年的某一个月，中学同学在西安铁一中搞离开中学二十周年纪念活动。就在我们高三时候用的教室。我听说，除了外地和国外没回去的，留在当地的同学，只有寒风没去。没有人知道寒风的下落。那个活动是她妈妈我们的旧班主任主持的，但她也不知道女儿如今的下落。或者是她不愿意说。有些伤害是一生的、致命的。",
              "simpEn": "A few years ago, our class had a 20-year reunion in our old classroom. Among those who still lived nearby, only Han Feng didn't come. No one knew where she was. Her mother, our old teacher, hosted the event but said she didn't know—or wouldn't say. Some wounds are lifelong and deadly.",
              "simpZh": "前几年，中学同学在铁一中搞毕业二十周年聚会，在我们高三的教室。听说除了外地和国外的，留下的同学里只有寒风没去。没人知道她的下落。聚会是她妈妈、我们的旧班主任主持的，但她也不知道女儿在哪儿，或者不愿说。有些伤害是一辈子的、致命的。"
            },
            {
              "en": "There is usually news of classmates. For instance, everyone knows that I, Huang Xiang, the prodigy poet, have been roaming to and fro, and am now spending a certain Toronto winter sleeping long hours, waiting for snow, writing a secret history of the soul.",
              "zh": "同学中，基本还会有个消息。例如我，大家都知道，如今，神童诗人黄翔虽然跑来跑去，目前却活在多伦多的某个冬天里，睡睡大觉，等等雪花，写写心灵史。",
              "simpEn": "Usually there's news about classmates. Everyone knows I, Huang Xiang, the child poet, have been moving around and now live in Toronto, sleeping a lot, waiting for snow, and writing a secret inner history.",
              "simpZh": "同学之间一般会有消息。比如我，大家都知道神童诗人黄翔跑来跑去，现在在多伦多的冬天里睡大觉、等雪花、写心灵史。"
            },
            {
              "en": "The truth is, even twenty-odd years ago, Han Feng—that girl who loved to fix her wild, unwavering stare on boys—already showed signs of a life that would diverge sharply from those of us grinding toward the exams. I remember: there were always loutish boys from the <span class=\"vocab-trigger\" data-vocab=\"slow classes\">slow classes<\/span> who would straddle the wall at midnight and whistle her name. I once saw, one afternoon, in a cornfield not far away, several of these young thugs gathered around her, their hands seeming to roam. The cornfield that day was a riot of leaves, the stalks standing like lines of poetry in the bud-heavy fields on the southern outskirts of Xi'an.",
              "zh": "其实，这个喜欢疯狂凝视男生叫寒风 的女生，二十多年前，就显示出了她的人生和其他积极考大学的同学的巨大不同。我记得，楼下总有流里流气的慢班男孩，半夜骑在墙上，喊她的名字和吹口哨。我还看见过有一天下午，在不远的玉米地里，好几个流氓男生，围着她，似乎在摸她。那天的玉米地，叶子招摇，类似诗歌一行行地长满在那些玉米含苞的西安南郊田野。",
              "simpEn": "Actually, even twenty years ago, Han Feng was different from us exam-focused students. Boys from the slow classes would sit on the wall at night and whistle her name. One afternoon I saw several thugs around her in the cornfield, their hands moving over her. The cornfield was full of waving leaves, like lines of poetry in the southern Xi'an countryside.",
              "simpZh": "其实，二十多年前，寒风就显示出了她和我们这些只顾考大学的人不一样。我记得楼下总有慢班的流气男孩半夜骑在墙上喊她名字、吹口哨。有一天下午，在不远的玉米地里，好几个流氓围着她，好像在摸她。那天的玉米地，叶子摇摇摆摆，像一行行诗长在西安南郊的田野里。"
            },
            {
              "en": "When I told Dai Dai and Lao Shui about this, Lao Shui was so furious he couldn't sleep properly for a month. His test scores dropped by an average of ten points per subject. He came close to begging his policeman father to stake out the cornfield and catch the hoodlums.",
              "zh": "我把这些事情，告诉戴戴和老水后，老水气得一个月没睡好。学习成绩起码每门课平均分下降十分。他就差告诉他的警察爸爸去玉米地打埋伏抓流氓了。",
              "simpEn": "When I told Dai Dai and Lao Shui, Lao Shui was so angry he couldn't sleep for a month. His grades dropped about ten points per subject. He almost asked his policeman father to hide in the cornfield and catch the bad guys.",
              "simpZh": "我把这些事告诉戴戴和老水后，老水气得一个月没睡好。成绩每门降了十分。他差点就叫他警察爸爸去玉米地埋伏抓流氓了。"
            },
            {
              "en": "So it was that, with me acting as ghostwriter, Lao Shui composed a love letter to Han Feng, vowing to be her lifelong protector. After evening self-study, Dai Dai and I stopped her in the hallway to deliver it. I still vaguely recall one of the lines I wrote: <em>\"Your grace is my warmth. Your gaze, my dreamscape.\"<\/em> That, I suppose, was the earliest literary work of this chronicler of dreams—discounting the seven <span class=\"vocab-trigger\" data-vocab=\"doggerel verses\">doggerel verses<\/span> he wrote at age seven, answering the Chairman's call to denounce the capitulationist <span class=\"vocab-trigger\" data-vocab=\"Song Jiang\">Song Jiang<\/span> from the classical novel.",
              "zh": "于是，由我捉刀，老水给寒风写了一封情书，说要做她人生的永远的保护者。下晚自习后，由我和戴戴拦住寒风去交给她。我依稀还记得我在情书里的写的一句话，那就是：“你的倩影是我的温暖。你的目光，是我的梦境。”这应该是这位写作梦境的文人的最早的文学作品。当然，如果不算他在七岁的时候，因响应领袖的号召，写的批判古代文学里的投降派宋江的七首打油诗。",
              "simpEn": "So I ghostwrote a love letter for Lao Shui, promising to protect Han Feng forever. After evening study, Dai Dai and I gave it to her. I still remember a line: 'Your beautiful shadow is my warmth. Your eyes are my dream.' That was my earliest literary work—except for seven silly poems I wrote at age seven, following Chairman Mao's call to criticize the character Song Jiang.",
              "simpZh": "于是我帮老水代笔写了一封情书，说要永远保护寒风。晚自习后，我和戴戴拦住她交给了她。我还记得我写的一句话：“你的倩影是我的温暖，你的目光是我的梦境。”这算是我这个写梦文人的最早作品——不算七岁时响应领袖号召写的批判宋江投降派的七首打油诗。"
            },
            {
              "en": "To our astonishment, Han Feng handed the letter straight to her mother. She said her life belonged to herself alone and she needed no one's protection. But the greatest surprise was this: we had forgotten to sign it. Teacher Zhao summoned the three of us, determined to find out which one, with the college exam bearing down, had ideas about an <span class=\"vocab-trigger\" data-vocab=\"early romance\">early romance<\/span>. I was ruled out first, being two or three years younger than the others and still shorter than Han Feng.",
              "zh": "没想到，寒风把那情书上交了她妈妈。她说她的人生只属于她自己不需要任何人的保护。最没想到的还是，那情书忘记了署名。结果赵老师召集我们三人开会，要弄清高考在即，这三人到底谁想早恋。我首先被排除怀疑，因为我小他们两三岁，那时候还没有寒风长得高。",
              "simpEn": "Surprisingly, Han Feng gave the letter to her mother. She said her life was her own and she needed no one's protection. Worse, we forgot to sign it. Teacher Zhao called us three to find out who wanted an early romance. I was ruled out because I was younger and shorter than Han Feng.",
              "simpZh": "没想到寒风把信交给了她妈妈。她说她的人生只属于自己，不需要别人保护。最意外的是信忘了署名。赵老师把我们三个叫去，要查清高考前谁想早恋。我先被排除了，因为我比他们小两三岁，那时还没寒风高。"
            },
            {
              "en": "Teacher Zhao said she was grateful someone liked her daughter, but the crucial thing now was the exam; all other matters could wait until we were older. In my heart I thought: Lao Shui was surely a better match for her than those street punks. Then again, perhaps matters of suitability aren't for outsiders to judge. Just as whether that Russian woman in Toronto and I are suitable—only I can know that.",
              "zh": "赵老师说，感谢有人喜欢她女儿。但现在的关键是高考要紧。别的事情等长大了再说。我当时心里就想，老水总比那些小流氓更适合她女儿。也许，人生里的合适与不合适，不是外人可以随意判断的。就像说，在多伦多，我和那个俄国女人合适不合适，只有我自己知道。",

              "simpZh": "赵老师说感谢有人喜欢她女儿，但现在关键是高考，别的事长大再说。我心里想，老水总比那些小流氓适合她女儿。不过，合不合适外人不好说。就像在多伦多我和那个俄国女人合不合适，只有我自己知道。"

          "sectionId": 11,
          "heading": "Chocolate Hearts and a Forced Confession",
          "paragraphs": [
            {
              "en": "A month later, during the school's New Year's Day long-distance race, I rode my bicycle and intercepted a panting Han Feng halfway along the route to press Lao Shui's New Year's gift into her hands: a bar of chocolate. <em>Energy candy from Lao Shui,<\/em> I told her. Meanwhile, up ahead, Lao Shui was sprinting for the class's glory and finished first in the entire school.",
              "zh": "一个月后，在学校元旦长跑中，我还骑着车子，半路拦截给气喘吁吁的寒风送上了老水的新年礼物巧克力。我对她说，那是老水给她的加油糖。老水则在前面为班争光，奋力冲刺，跑了全校第一。",
              "simpEn": "A month later, during the New Year race, I rode my bike and stopped Han Feng to give her Lao Shui's chocolate gift. I said it was energy candy from him. Lao Shui was sprinting ahead and won first place for our class.",
              "simpZh": "一个月后，学校元旦长跑，我骑车半路拦下气喘吁吁的寒风，给她老水的新年礼物巧克力。我说那是老水给的加油糖。老水在前面为班级争光，奋力冲刺，跑了全校第一。"
            },
            {
              "en": "At the New Year's party, Teacher Zhao, before the whole class, unwrapped that chocolate of love and shared it out to everyone. As the bar was broken square by square and passed along, I knew, in that moment, it wasn't just Lao Shui's heart that shattered—Dai Dai's and mine made a cracking sound as well.",
              "zh": "新年联欢会上，班主任赵老师，当着全班同学的面，为大家分食了那些爱情巧克力。巧克力被一版版分开的时候，我知道，那一刻，不光老水的心碎了，我和戴戴的心同时也在发出破裂的声音。",
              "simpEn": "At the New Year party, Teacher Zhao opened the love chocolate and passed it out to everyone. As the bar was broken into pieces, I knew that not only Lao Shui's heart broke—Dai Dai's and mine cracked too.",
              "simpZh": "新年联欢会上，赵老师当着全班的面把那盒爱情巧克力分给大家吃。巧克力一块块掰开的时候，我知道，那一刻不光老水的心碎了，我和戴戴的心也裂开了。"
            },
            {
              "en": "Throughout high school, though I was scrawny and undersized, I was unanimously considered the filthiest-minded little old man among us. Dai Dai called me the <span class=\"vocab-trigger\" data-vocab=\"Great Suppressed Lecher\">Great Suppressed Lecher<\/span>. In truth, he was the one who plunged into a real early romance. One windy moonlit night, the class beauty Wang Feng offered him a ride on her bicycle; once they reached the empty fields outside the city, she pulled him into her arms and took his precious first kiss. So whenever he called me the Great Suppressed Lecher, I fired back that he was the real <span class=\"vocab-trigger\" data-vocab=\"Great Slut\">Great Slut<\/span>. <em>Sao huo<\/em>—slut—also carries the echo of \"poet,\" doesn't it? As in <em><span class=\"vocab-trigger\" data-vocab=\"Li Sao\">Li Sao<\/span><\/em>, \"Encountering Sorrow.\" And Dai Dai could indeed write classical verses with proper rhyme. He was always mocking my free-verse modern poems for lacking any.",
              "zh": "高中时期，我虽然长得瘦小，但却一致被同学们认为是思想最黄色的小老头。戴戴则叫我大闷骚。事实上，他到去真正地早恋了。同班大美女王凤在一个风高月夜，先是说骑车带他一程。后来就在荒野里直接把他搂进怀抱，夺去了他宝贵的初吻。所以，一旦他说我大闷骚，我则反击他才是真正的大骚货。骚货，据说还有诗人的意思，不是有《离骚》呀。不过戴戴也真会写点押韵的古诗词。他总是讽刺我写的现代诗不押韵。",
              "simpEn": "In high school, though I was small, everyone thought I had the dirtiest mind. Dai Dai called me the Great Suppressed Lecher. But he was the one who really fell in love. One windy night, the pretty Wang Feng gave him a bike ride and kissed him in the fields. So when he called me a lecher, I called him a Great Slut. 'Sao huo' also sounds like 'poet'—from 'Li Sao'. Dai Dai could write rhyming classical poems and mocked my free verse for having no rhymes.",
              "simpZh": "高中我虽然瘦小，却被大家公认思想最黄。戴戴叫我大闷骚。其实他才是真正早恋的。一个大风月夜，班花王凤骑车带他，到荒野里搂住他夺走了初吻。所以他一说我大闷骚，我就反击他才是大骚货。骚货也指诗人，《离骚》的骚。不过戴戴确实会写押韵的古诗，老讽刺我写的现代诗不押韵。"
            },
            {
              "en": "In our second-to-last year, the Chinese teacher finally exploded over one of my essays. The assignment was \"What Are You Doing in the Days of Marching Toward the Four Modernizations?\" In it, I described how a classmate's mother might have been a prostitute in Hong Kong, and that the girl had inherited a distinctively <span class=\"vocab-trigger\" data-vocab=\"wanton air\">wanton air<\/span> in the way she walked. This was how I chose, in a composition on the nation's future, to hold forth on a certain girl's swaying, serpentine waist. What I considered a surrealist fictional technique, the teacher saw as the most vicious and indecent personal attack on modern womanhood. In a fury, he read my lurid passage aloud to the class and declared that deep in my consciousness I was rotten—not just a suppressed lecher, but a budding criminal. The accusation brought back the moment I'd heard, as a child, that my grandfather had several wives.",
              "zh": "高二那年，语文老师终于为我的一篇作文大发雷霆。因为我在一篇叫《进军四个现代化的日子里，你在做什么》的作文里面这么描写，我的一个同学的母亲有可能在香港做过妓女，所以她被遗传得走路的样子里有一种强烈的风尘味道。当年，我就是这么在自己有关国家未来的作文里这么议论水蛇腰的。我自以为的超现实小说写法，被语文老师认为，这是我对现代女性最恶毒和下流的人身攻击。他很激愤地在全班宣读我的黄色描写，说我意识深处很坏，不光闷骚，长大了就是大流氓一个。他这么说我，让我想起来，小时候在听见祖父有好几个老婆时候的时刻。",
              "simpEn": "In my second-last year, the Chinese teacher got furious over one essay. The topic was about marching toward modernization, but I wrote that a classmate's mother might have been a prostitute in Hong Kong and the girl walked with a sexy sway. I thought it was surreal fiction, but the teacher said it was a vicious attack on women. He read my dirty description aloud and said my mind was rotten, that I would become a criminal. That reminded me of hearing that my grandfather had several wives.",
              "simpZh": "高二那年，语文老师对我一篇作文大发雷霆。题目是《进军四个现代化的日子里，你在做什么》，我却写一个同学的母亲可能在香港当过妓女，所以她走路有股风尘味。我自以为是用超现实手法写作，老师却说这是对现代女性最下流的人身攻击。他在全班念我的黄色描写，说我意识很坏，不光闷骚，长大了就是大流氓。他的话让我想起小时候听说祖父有好几个老婆的时候。"
            },
            {
              "en": "The whole class, I suspect, felt a flash of <span class=\"vocab-trigger\" data-vocab=\"schadenfreude\">schadenfreude<\/span>. Most of them had long been oppressed by my particular brand of quiet obscenity. I routinely handed in my exams half an hour early while they, two years my senior, were still bent over their papers, sweating rivers. Then the teacher read aloud Dai Dai's essay on the spot and told everyone to write like him—with a clear central theme, ideological colours nailed to the mast—if they wanted high marks.",
              "zh": "全班同学那一刻应该都有点幸灾乐祸，因为他们中的大多数被我这闷骚压抑久了。我总是在考试半个小时后提前交卷，而长我两岁多的他们还在埋头大汗般地努力奋斗拼搏。然后，语文老师又当场阅读了戴戴的作文，说大家都要像他那样围绕中心思想旗帜鲜明地写，高考才能得高分。",
              "simpEn": "I think the whole class felt a bit of schadenfreude because they had been annoyed by my dirty mind for a long time. I always finished exams half an hour early while they, older than me, were still sweating over theirs. Then the teacher read Dai Dai's essay and said everyone should write like him—with a clear main idea and strong political colour—to get high marks.",
              "simpZh": "全班同学那一刻大概都有点幸灾乐祸，因为他们被我这闷骚压抑太久了。我老在考试半小时后就交卷，而比我大两岁的他们还在满头大汗地奋斗。接着老师又读了戴戴的作文，说大家都要像他那样旗帜鲜明、围绕中心思想写，才能高考得高分。"
            },
            {
              "en": "Finally, the teacher demanded the class declare whether I was a degenerate and deserved to be deeply denounced. Dai Dai stood up. A true brother. He said that although the teacher had just praised him, he had to point out that Huang Xiang's body hadn't even finished developing yet; physically, it was impossible for him to be a real degenerate. At most, he was a verbal one.",
              "zh": "最后，语文老师让全班同学表态，我平时是不是很流氓，值得大家深刻地批判。戴戴却站了起来。他真够哥们，他说，虽然老师表扬了他，当他还得说，黄翔目前发育还没完，身体上就让他不可能是流氓。他也就口头流氓了点。",
              "simpEn": "Finally, the teacher asked the class to say whether I was a real delinquent. Dai Dai stood up. He was a true friend. He said that even though the teacher just praised him, Huang Xiang wasn't fully grown yet, so he couldn't be a real criminal. At most, he was just a verbal one.",
              "simpZh": "最后，语文老师让全班表态我是不是很流氓，该不该深刻批判。戴戴站了起来。真够哥们。他说虽然老师表扬了他，但他得说，黄翔身体还没发育完，不可能是流氓。最多嘴上流氓点。"
            },
            {
              "en": "Then Lao Shui rose. <em>Teacher, please,<\/em> he said, <em>don't drag out that Cultural Revolution stuff again.<\/em> And after him, Han Feng—the very girl who had turned over the chocolate love token—stood up. She said that Huang Xiang was a rare prodigy and that his individuality deserved respect.",
              "zh": "然后站起来的还有老水。他说，老师老师，求你就别搞“文革”那套了。接着，就是把我送的巧克力情物交公的寒风。她说，黄翔是少见的神童，值得大家尊重他的个性。",
              "simpEn": "Then Lao Shui stood up. He said: 'Teacher, please don't use that Cultural Revolution way.' And after him, Han Feng—the one who gave away the chocolate—stood up and said Huang Xiang was a rare prodigy and his personality deserved respect.",
              "simpZh": "然后老水也站了起来。他说：老师，求你别搞文革那一套了。接着，把巧克力交公的寒风也站起来了。她说黄翔是少见的神童，大家应该尊重他的个性。"
            },
            {
              "en": "I saw the Chinese teacher's lips tremble. <em>Even a prodigy,<\/em> I heard him say, <em>is still a hoodlum prodigy.<\/em>",
              "zh": "那一刻我看见语文老师的嘴唇在发抖。我听他说，就是神童也是流氓神童。",
              "simpEn": "I saw the teacher's lips shaking. 'Even a prodigy,' he said, 'is still a hoodlum prodigy.'",
              "simpZh": "我看到语文老师的嘴唇在发抖。他说：就是神童也是流氓神童。"
            },
            {
              "en": "By then, my legs were trembling too, cowed by the teacher's fury. But I stood up anyway. I cleared my throat. No one expected what came next: I instantly confessed to my grave error in life. I was cunning, you see. I didn't want this teacher who had always had it in for me to keep sabotaging my essay marks and wreck my class ranking. So I offered the whole class a deep self-criticism, starting from the depths of my soul, stopping just short of recalling past bitterness to savour present sweetness and recounting the evils of the old society.",
              "zh": "那会，我的腿被语文老师的气势吓得也有了 些发抖。我还是站了起来。我清了清嗓子，大家没想到的是，我马上立刻，就承认了我的重大人生错误。我比较狡猾，我不想和我一贯过不去的语文老师以后老给我的作文打低分影响我在班上的考试排名。我对全班同学做了深刻的检讨，从心灵深处开始，就差忆苦思甜地说说旧社会了。",
              "simpEn": "My legs were shaking too from the teacher's anger. But I stood up anyway. I cleared my throat. No one expected me to immediately admit my big mistake. I was clever. I didn't want this teacher who always disliked me to keep giving me low marks. So I gave a deep self-criticism to the class, starting from my soul, almost telling bitter stories about the old society.",
              "simpZh": "我的腿也被老师的气势吓抖了。但我还是站了起来，清了清嗓子。大家没想到，我马上承认了自己的重大错误。我很狡猾，不想这个一直跟我过不去的老师以后老给我作文打低分，影响排名。于是我向全班做了深刻检讨，从灵魂深处开始，差点就忆苦思甜讲旧社会了。"
            },
            {
              "en": "I vowed never again to write words like <em>prostitute<\/em>, <em>love<\/em>, or <em>flirtation<\/em>—such obscene vocabulary—in my compositions. I would follow <span class=\"vocab-trigger\" data-vocab=\"Lu Xun\">Lu Xun<\/span>'s example and write only in the noble language of the <span class=\"vocab-trigger\" data-vocab=\"willing ox\">willing ox<\/span>. As I sat down, I heard Han Feng mutter beside me: <em>Man without backbone.<\/em> I shot back a line: \"Backbone or not, we'll see in twenty years. <span class=\"vocab-trigger\" data-vocab=\"Ride the donkey and read the songbook—wait and see\">Ride the donkey and read the songbook—wait and see<\/span>.\"",
              "zh": "我说，以后，我再也不在作文里写什么妓女、爱情、调逗之类的黄色词汇。我要向人家鲁迅学习，只写孺子牛般的高尚语文。我坐下来的时候，听见寒风在一边说道，没出息的男人。我回她一句：“有没有出息，二十年后，骑驴看唱本。”",
              "simpEn": "I promised never to write dirty words like prostitute, love, or flirting in my essays again. I would learn from Lu Xun and write only noble words like a willing ox. As I sat down, Han Feng muttered: 'Man with no spine.' I answered: 'Spine or not, let's see in twenty years. Ride the donkey and read the songbook—we'll wait and see.'",
              "simpZh": "我保证以后再也不在作文里写妓女、爱情、调逗这些黄色词汇。我要向鲁迅学习，只写孺子牛般高尚的文字。我坐下时，听见寒风在一边说：没出息的男人。我回她一句：“有没有出息，二十年后，骑驴看唱本——走着瞧。”"
            }

          "heading": "Cornfield Nightmare and Aftermath",
          "paragraphs": [
            {
              "en": "In the blink of an eye, over twenty years have slipped away. Yesterday I called Dai Dai, who now works at <span class=\"vocab-trigger\" data-vocab=\"Intel in California\">Intel in California<\/span>. We talked for a long time. I mentioned that, knowing he was at Intel, I had once invested quite a bit in the company's stock—only to lose a painful sum when the American <span class=\"vocab-trigger\" data-vocab=\"tech bubble burst\">tech bubble burst<\/span>. We spoke almost nothing of our youth, those days <span class=\"vocab-trigger\" data-vocab=\"solemn as mountains and smooth as silk\">solemn as mountains and smooth as silk<\/span>. Those stories have become <span class=\"vocab-trigger\" data-vocab=\"shapeless\">shapeless<\/span>, neither one thing nor the other; they are now a forbidden territory between us.",
              "zh": "一晃，已经二十几年过去了。昨天，我和如今在美国加州英特尔公司工作的戴戴通了一个电话。我们谈了很长时间，还说到我因为知道因为戴戴在英特尔公司工作，我特地投资过不少英特尔公司的股票。结果在美国科技股泡沫崩溃的时候大赔了一笔。我们几乎没提到任何少年时代如山如绸的往事，那些故事目前不伦不类，已经是我们俩谈话的禁区之一。",
              "simpEn": "Twenty years passed in a flash. Yesterday I called Dai Dai, who now works at Intel in California. We talked a long time. I told him I invested in Intel stock because he worked there, but I lost money when the tech bubble burst. We hardly talked about our youth, those days like mountains and silk. Those stories have become shapeless and are now a forbidden topic.",
              "simpZh": "一转眼二十多年过去了。昨天我给在加州英特尔工作的戴戴打了个电话。我们聊了很久。我说因为他就在英特尔，我还投资过不少英特尔股票，结果科技股泡沫时赔了一大笔。我们几乎没提少年时代那些如山如绸的往事。那些故事现在不伦不类，成了我们谈话的禁区。"
            },
            {
              "en": "While we were on the phone, I suddenly felt a pain in my left eye, even though I knew perfectly well there was no longer any physical cause. Over all these years, the eye has somehow climbed from a post-injury <span class=\"vocab-trigger\" data-vocab=\"vision of 0.1\">vision of 0.1<\/span> to 0.8. That, perhaps, is the true index of courage in my life.",
              "zh": "和他打电话的时候，忽然我感觉到了我左眼的疼痛。虽然我心里明白，那里现在一般已经没有了生理疼痛。这么多年，这只眼睛居然在受创后从视力0.1一直上升到了目前的0.8。这也许就是 我人生真正的勇气指数。",
              "simpEn": "During the call, I felt a sudden pain in my left eye, though I knew there was no real physical pain. Over the years, that eye has improved from 0.1 vision to 0.8. Maybe that's the real measure of my courage in life.",
              "simpZh": "打电话的时候，我忽然感觉左眼疼，虽然我知道那里其实已经不会再生理疼痛了。这么多年，这只受伤的眼睛视力居然从零点一升到了零点八。这可能才是我人生真正的勇气指数。"
            },
            {
              "en": "Because that eye is weak, I tend to squint with it when I read, or watch a film, or drive. My ex-wife Amy used to say it made me look like some kind of <span class=\"vocab-trigger\" data-vocab=\"special-ops agent\">special-ops agent<\/span>, forever taking aim.",
              "zh": "因为这只眼睛不怎么好，我读书或者看电影，开车的时候，都喜欢眯着这只眼睛。我的前妻艾米总喜欢这么说，说我这样子就像一个需要经常瞄准的职业特工队。",
              "simpEn": "Because that eye is weak, I squint with it when reading, watching movies, or driving. My ex-wife Amy said it made me look like a special agent, always aiming.",
              "simpZh": "因为这只眼不好，我看书、看电影、开车时都喜欢眯着它。前妻艾米总说我这样像个老要瞄准的特工。"
            },
            {
              "en": "There was a moment in my youth when I thought that eye would go dark forever. When the brick came flying at me, I was nothing but a hollow paper shell of a human being. I had no courage, only a bloodless heart leaping with terror inside an empty chest.",
              "zh": "年少时代，有一刻，我以为这只眼睛就要熄灭了。当那块砖头扑上来的时候，我，看上去不过是一个人生空洞的纸躯壳。我没有任何勇气，只有没有了血液的心在惊恐地空跳。",
              "simpEn": "Once in my youth, I thought that eye would go blind forever. When the brick flew at me, I was just an empty paper shell of a person. I had no courage, only a heart jumping with fear.",
              "simpZh": "小时候，有一刻我以为这只眼睛要永远熄灭了。当砖头飞过来时，我就像一个空洞的纸壳子，没有任何勇气，只有心脏在恐惧地空跳。"
            },
            {
              "en": "It was the early summer of our final year, two months before the college entrance exam. The corn was not yet tall. And I was like those stalks—a skinny figure just barely beginning to sprout, a boy who styled himself a poet of science, seen from behind.",
              "zh": "那是在高三，即将考大学前两个月的初夏里。玉米们还不是长得很高。类似刚刚开始遗精的我，一个号称是有关诗歌与科学的瘦小背影。",
              "simpEn": "It was early summer, two months before the big exam. The corn wasn't yet tall. And I was like those corn stalks—a skinny boy just starting to grow, calling himself a poet of science.",
              "simpZh": "那是高三，离高考还有两个月的初夏。玉米还没长高。就像刚开始遗精的我，一个瘦小的背影，自称是诗歌与科学的结合。"
            },
            {
              "en": "By then we were not far from home. We both lived in the <span class=\"vocab-trigger\" data-vocab=\"Railway New Village\">Railway New Village<\/span>, a jumble of low bungalows and boxy apartment blocks huddled in the dark. We were walking through the same cornfield we crossed every day. In daylight, following this path, you could still make out the lonely <span class=\"vocab-trigger\" data-vocab=\"Dayan Pagoda\">Dayan Pagoda<\/span> in the distance, the dim line of the <span class=\"vocab-trigger\" data-vocab=\"Qinling Mountains\">Qinling Mountains<\/span>, and the silent expanse of open country on the southern edge of Xi'an.",
              "zh": "那一会，离我们俩的家其实已经不远。我们就住在那黑暗中的平房和楼房间立的铁路新村。我们走过我们每天必然路过的那片玉米地。白天，我们沿着这里，还能看见不远处孤独的大雁塔和暗淡的秦岭群山以及寂静的陕西西安南郊旷野。",
              "simpEn": "We were not far from home then. We both lived in the Railway New Village, a mix of low houses and apartment blocks. We walked through the cornfield we crossed every day. In daytime, you could see the lonely Dayan Pagoda, the Qinling Mountains, and the empty fields south of Xi'an.",
              "simpZh": "那时离家已经不远了。我们都住在铁路新村，一片低矮平房和楼房挤在黑暗中。我们正走过每天必经的那片玉米地。白天从这里能看见远处孤独的大雁塔，暗淡的秦岭，还有寂静的西安南郊旷野。"
            },
            {
              "en": "When <span class=\"vocab-trigger\" data-vocab=\"Black-Skin Lao Si\">Black-Skin Lao Si<\/span> and his gang of young thugs surrounded Han Feng, at first there was still a spark of manhood in me. I heard her cry out; I picked up a brick and walked toward them. I meant to shout at them to stop. But the sound was too small, crushed under my tongue. Even if it had come out, it would have sounded like begging.",
              "zh": "当黑皮老四和其他那几个小流氓围住寒风的时候，起初我还是有一星星的男人气概的。我听见了寒风的呼救，我摸起那块砖头走了过去。我想喊他们住手。但那声音太小了被压在了舌头下，就是说出来也似乎不过是在哀求他们。",
              "simpEn": "When Black-Skin Lao Si and his gang surrounded Han Feng, at first I felt a little courage. I heard her cry; I picked up a brick and walked over. I wanted to yell at them to stop, but the sound was too small, stuck under my tongue. It would have sounded like begging.",
              "simpZh": "当黑皮老四和那几个小流氓围住寒风时，一开始我还有一点男人气。我听到她呼救，摸起一块砖头走过去。我想喊他们住手，但声音太小了，压在舌头底下，说出来也像哀求。"
            },
            {
              "en": "Then I saw the blade in Black-Skin's hand—wickedly bright, glinting. And my fingers simply opened. The brick fell to the ground first; later, by way of Black-Skin's own hand, it landed on my eye. I heard him bark at me to crouch down and stay put, not to make a sound, or he would gut me.",
              "zh": "但当我看见黑皮老四手中的贼亮贼亮地闪光的尖刀后，我的手居然就松开了。砖头先落在地上，后来又经过黑皮老四的手落在我的眼睛上。我听见黑皮老四喝令我蹲在原地，不许叫喊，不然就捅了我。",
              "simpEn": "But when I saw the shiny knife in Black-Skin's hand, my hand just opened. The brick fell to the ground; later, through Black-Skin's hand, it hit my eye. He shouted at me to squat down and stay quiet, or he'd stab me.",
              "simpZh": "但看到黑皮老四手里那把贼亮的尖刀后，我的手就松开了。砖头掉在地上，后来又被黑皮老四的手砸到我眼睛上。我听见他喝令：蹲着别动，不许喊，不然捅了你。"
            },
            {
              "en": "And I did. I crouched there, right where I stood, unable to move a single step farther. I wept silently, not daring to make a noise. All around me the corn leaves rustled and hissed. I heard Han Feng screaming at me to run, to get help, to call the police. But my legs had turned soft; I could not move, not at all. Blood ran through my fingers like water. The smell choked me, flooded me with panic. I could not make my body obey. I was fixed. I had lost myself. I told myself I was just a callow prodigy, not a grown man with strength.",
              "zh": "我真的就蹲在了原地，一步也不敢再挪动了。我在默默地哭泣，也不敢出声。四周全是玉米叶子的哗哗声。我听见寒风喊我快跑，去叫人或者报警。但我的腿全软了，我动不了一点也动不了。我的手缝间流着水一样的血。那种气味让我窒息和恐慌。我一点也挪动不了我自己了。我被定住了。我失去了我。我对自己说我只不过是一个稚嫩神童，不是一个成熟有力的大男人。",
              "simpEn": "I really did. I squatted there, too afraid to move. I cried silently, afraid to make a sound. Corn leaves rustled everywhere. I heard Han Feng scream at me to run, get help, call the police. But my legs were soft; I couldn't move at all. Blood ran like water through my fingers. The smell made me choke and panic. I couldn't move my body. I was stuck. I lost myself. I told myself I was just a young prodigy, not a strong grown man.",
              "simpZh": "我真的蹲在了原地，一步都不敢动。我默默流泪，不敢出声。周围全是玉米叶子哗哗响。我听见寒风喊我快跑，去叫人，去报警。但我的腿全软了，一动都动不了。血像水一样从手缝流出来。那种气味让我窒息和恐慌。我完全动不了自己。我被定住了。我失去了自己。我对自己说，我只是个稚嫩的神童，不是个有力气的大男人。"
            },
            {
              "en": "Not far away, they raped her, one after another, brutally. I heard her screams cutting through the night wind, and the sound of all the poetry I had ever known sweeping across the shivering cornfield and falling to the ground. Only later did I learn that she had still been a virgin. Before that night, the boys had done nothing more than grope her chest.",
              "zh": "他们在不远的地方残酷地轮奸了寒风。我听见夜风中的尖叫，和快速地掠过那些涩涩发抖的玉米地后落在地上的所有诗歌。后来我才知道，那时候，寒风其实还是处女。以前，她只不过被流氓们摸过胸而已。",
              "simpEn": "Not far away, they cruelly raped her, one after another. I heard her screams in the wind, and all the poetry I had ever known was blown across the shaking cornfield and fell to the ground. Later I learned she had still been a virgin. Before that, the boys had only touched her chest.",
              "simpZh": "他们就在不远的地方轮奸了寒风。我听见夜风中她的尖叫，还有我所有熟悉的诗歌都被吹过瑟瑟发抖的玉米地，落在地上。后来我才知道，那时寒风还是处女。以前，他们最多只是摸过她的胸。"

            {
              "en": "I stayed crouched there. My hands were full of tears, shame, and blood—like some hideous poem.",
              "zh": "我就一直那么蹲在那里。手里充满了诗歌般的眼泪羞愧和血液。",

            },
            {
              "en": "Afterward, it was Han Feng who pulled up her trousers and went back to raise the alarm. She was the one who got me to the hospital.",
              "zh": "事后，还是寒风提着裤子回去叫人，把我送去了医院。",
              "simpEn": "Afterward, it was Han Feng who pulled up her pants and went to get help. She was the one who took me to the hospital.",
              "simpZh": "事后，是寒风提上裤子回去叫人，把我送去了医院。"
            },
            {
              "en": "Later still, Black-Skin Lao Si got the heaviest sentence: twenty years. My left eye came close to going blind. Yet Han Feng and I both sat the college entrance exam as planned. My cunning little brain once again unleashed its enormous energies. I was even awarded twenty <span class=\"vocab-trigger\" data-vocab=\"bonus points for courageous righteousness\">bonus points for courageous righteousness<\/span>. Together with Dai Dai, Lao Shui, and Wu Rou, I gained admission to USTC; I entered the Special Class for Gifted Youth. I had not yet turned sixteen—I caught the last bus. Han Feng did not even make the cut-off for a technical secondary school. She was said to have scored zero on the politics paper, because she felt her life no longer contained any light—or any politics.",
              "zh": "再后来，黑皮老四判得最高，是二十年。我的左眼一度几乎失明。但我和寒风还是坚持参加了高考。我的小聪明继续发挥出巨大能量。我还因为见义勇为而获得二十分加分。我和戴戴老水和吴柔一起考上了科大，我上的是少年班。我还没满十六，赶了一个末班车。而寒风却连中专线都没够。她的政治据说考了零分。因为她觉得她的人生从此没有光明和政治。",

              "simpZh": "再后来，黑皮老四判得最重，二十年。我左眼一度差点失明。但我和寒风还是参加了高考。我的小聪明继续发挥巨大能量，还因为见义勇为加二十分。我和戴戴、老水、吴柔一起考上科大，我上少年班。那时我还不到十六，赶上了末班车。寒风却连中专线都没过。据说她政治考了零分，因为她觉得人生从此没有光明和政治了。"

            {
              "en": "As for me, I felt my life had lost its courage. The day the exam results arrived, I felt not the slightest joy. I understood then that a certain sorrow, a certain loneliness, are simply inevitable. And that this sorrow and loneliness, added together, are what people call happiness. I was ready to go looking for my own happiness. I wanted to grow up. I had a premonition: Hefei would be far and cold, and once we prodigies landed there, not every one of us would remain a prodigy.",
              "zh": "而我，则觉得我的人生从此失去了勇气。得知高考得分那天，我毫无喜悦之感。觉得人生有些悲伤和孤独是必然的。这种悲伤孤独加起来就是所谓的快乐。我要去寻找属于我的快乐了。我要长大。我还有个预感，觉得合肥又远又冷，觉得神童们去了那里后，不见得个个还神。",
